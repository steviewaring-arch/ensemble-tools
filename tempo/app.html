<body data-theme="dark">
<div class="app">
  <aside class="panel" id="panelBox">
    <div class="brand">
      <div class="bline"><span class="mark">Tempo</span><span class="ver">{{version}}</span></div>
      <div class="bline caps">By ENSEMBLE</div>
    </div>
    <div class="scroll" id="panel" aria-label="Controls"></div>
  </aside>
  <div class="resizer" id="resizer" aria-hidden="true"></div>
  <main class="stage" id="stage">
    <div class="view" id="view"><canvas id="cv" width="1080" height="1080" aria-label="Screen saver preview"></canvas></div>
    <div class="stage-foot"><span id="dims"></span><span id="note"></span></div>
    <div class="appearance" id="appearance">
      <button data-t="light" title="Light mode" aria-label="Light mode"><svg viewBox="0 0 16 16" width="15" height="15"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <button data-t="dark" title="Dark mode" aria-label="Dark mode"><svg viewBox="0 0 16 16" width="15" height="15"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2.4 A5.6 5.6 0 0 1 8 13.6 Z" fill="currentColor"/></svg></button>
    </div>
    <div class="drop" id="drop">Drop fonts</div>
    <div class="status" id="toast" role="status" aria-live="polite"></div>
  </main>
</div>
<input type="file" id="fontfile" accept=".otf,.ttf,.woff,.zip,font/otf,font/ttf,font/woff,application/zip" multiple class="vh" tabindex="-1">
<input type="file" id="imgfile" accept="image/png,image/jpeg,image/webp,image/gif" class="vh" tabindex="-1">
