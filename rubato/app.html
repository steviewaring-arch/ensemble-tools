<body data-theme="light">
<div class="app">
  <main class="stage" id="stage">
    <div class="view" id="view"><canvas id="cv" width="1080" height="1080" aria-label="Animated type preview"></canvas></div>
  </main>
  <aside class="panel" id="panelBox">
    <div class="brand">
      <div class="bline"><span class="mark">Rubato</span><span class="ver">{{version}}</span></div>
      <div class="bline caps">By ENSEMBLE</div>
    </div>
    <div class="scroll" id="panel" aria-label="Controls"></div>
    <div class="resizer" id="resizer" aria-hidden="true"></div>
  </aside>
  <div class="topbar">
    <div class="stage-foot"><span id="dims"></span><span id="note"></span><span id="knote"></span></div>
    <div class="tools" id="appearance">
      <button id="previewBtn" type="button" aria-pressed="false" aria-label="Preview – fill the window – F"></button>
      <button id="themeBtn" type="button" aria-label="Light or dark"><svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7 1.8a5.2 5.2 0 0 1 0 10.4z" fill="currentColor"/></svg></button>
    </div>
  </div>
  <div class="island" id="island">
    <div class="sheets"><div id="islandSheets"></div></div>
    <div class="island-row"><div class="island-in">
      <div class="isl-main" id="islandMain">
        <button class="ebtn studio-only" id="play" aria-label="Pause">Pause</button>
        <input class="studio-only" id="scrub" type="range" min="0" max="1000" step="1" value="0" aria-label="Position in loop">
        <span class="act-main studio-only" id="time">0.00 / 3.00 s</span>
        <span class="ep-div studio-only"></span>
        <button class="ebtn studio-only" id="rand" title="Randomise (R)">Randomise</button><button class="ebtn icon studio-only" id="randOpt" aria-label="Randomise options" aria-expanded="false" title="Randomise options"><svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="ebtn studio-only" id="undo" title="Undo (Ctrl/Cmd+Z)" disabled>Undo</button>
      </div><span class="ep-div"></span>
      <div class="status" id="toast" role="status" aria-live="polite"></div>
      <button class="ebtn primary" id="exportOpen" type="button" aria-expanded="false" aria-controls="islandSheets" hidden>Export</button>
    </div></div>
  </div>
  <div class="pcap" id="pcap" hidden>
    <div class="sheets"><div id="pcapSheets"></div></div>
    <button class="pc-row" id="pcapOpen" type="button" aria-expanded="false" aria-controls="pcapSheets" data-tip="Presets"><span class="pc-ic"><svg viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="2" width="4" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="8" y="2" width="4" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="2" y="8" width="4" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="8" y="8" width="4" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></span><span class="pc-t">Presets</span><span class="pc-name" id="pcapName"></span><span class="chev"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 8.5 7 5l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
  </div>
  <div class="drop" id="drop">Drop fonts or an image</div>
</div>
<input type="file" id="fontfile" accept=".otf,.ttf,.woff,font/otf,font/ttf,font/woff" multiple class="vh" tabindex="-1">
<input type="file" id="imgfile" accept="image/png,image/jpeg,image/webp,image/gif" class="vh" tabindex="-1">
<input type="file" id="jsonfile" accept=".json,application/json" class="vh" tabindex="-1">
