<body data-theme="light">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@400;600;800&display=swap" rel="stylesheet">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="segue-levels" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncR type="linear" slope="1.16438" intercept="-0.07306"/><feFuncG type="linear" slope="1.16438" intercept="-0.07306"/><feFuncB type="linear" slope="1.16438" intercept="-0.07306"/></feComponentTransfer></filter></svg>
<div class="app">
  <main class="stage" id="stage">
    <div class="view" id="view"><canvas id="cv" width="1080" height="1350" aria-label="Preview of the loop"></canvas></div>
  </main>
  <aside class="panel" id="panelBox">
    <div class="brand">
      <div class="bline"><span class="mark">Segue</span><span class="ver">{{version}}</span></div>
      <div class="bline caps">By ENSEMBLE</div>
    </div>
    <div class="scroll" id="panel" aria-label="Controls"></div>
    <div class="resizer" id="resizer" aria-hidden="true"></div>
  </aside>
  <button class="panel-btn" id="panelBtn" type="button" aria-expanded="false" aria-controls="panelBox" aria-label="Show the panel"><svg viewBox="0 0 14 14" aria-hidden="true"><rect x="1.8" y="2.5" width="10.4" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5.2 2.5v9" stroke="currentColor" stroke-width="1.3"/></svg></button>
  <!-- 0.17 – the guide: what you can do with whatever's selected, top left over the stage -->
  <div class="selhint" id="selHint" hidden aria-live="polite"></div>
  <div class="topbar">
    <div class="stage-foot"><span id="dims"></span><span id="loopChip"></span><span id="countChip"></span></div>
    <!-- 0.10: undo, zoom and guides, beside the info and the theme -->
    <div class="tools" id="historyTools">
      <button id="undoBtn" type="button" aria-label="Undo – ⌘Z" data-tip="Undo – ⌘Z"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M5.2 3.3 2.6 5.9l2.6 2.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 5.9h5.6a2.9 2.9 0 0 1 0 5.8H6.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
      <button id="redoBtn" type="button" aria-label="Redo – ⇧⌘Z" data-tip="Redo – ⇧⌘Z"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="m8.8 3.3 2.6 2.6-2.6 2.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 5.9H5.4a2.9 2.9 0 0 0 0 5.8h2.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
    </div>
    <div class="tools" id="zoomTools">
      <button id="zoomOut" type="button" aria-label="Zoom out – ⌘−" data-tip="Zoom out – ⌘−"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 7h7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
      <button id="zoomVal" class="zval" type="button" aria-label="Zoom – click for 100% or to fit" data-tip="Click for 100%, again to fit – ⌘0 fits">Fit</button>
      <button id="zoomIn" type="button" aria-label="Zoom in – ⌘+" data-tip="Zoom in – ⌘+"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 7h7M7 3.5v7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
    </div>
    <div class="tools" id="guideTools">
      <button id="guidesBtn" type="button" aria-pressed="false" aria-label="Guides – ⌘;" data-tip="Guides – ⌘;"><svg viewBox="0 0 14 14" aria-hidden="true"><rect x="1.8" y="1.8" width="10.4" height="10.4" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M5.3 2v10M8.7 2v10M2 7h10" stroke="currentColor" stroke-width="1" stroke-dasharray="1.4 1.2"/></svg></button>
      <button id="guidesMore" class="more" type="button" aria-expanded="false" aria-controls="guidePop" aria-label="Guide settings" data-tip="Margin, grid and snap"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="m4.2 5.6 2.8 2.8 2.8-2.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="pop" id="guidePop" hidden role="dialog" aria-label="Guides"></div>
    </div>
    <div class="tools" id="appearance">
      <button id="previewBtn" type="button" aria-pressed="false" aria-label="Preview – fill the window – F"></button>
      <button id="themeBtn" type="button" aria-label="Light or dark"><svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7 1.8a5.2 5.2 0 0 1 0 10.4z" fill="currentColor"/></svg></button>
    </div>
  </div>
  <!-- the project (0.10; on the bottom line with the play bar and the presets from 0.17) -->
  <div class="projbar" id="projBox">
    <button class="proj-btn" id="projBtn" type="button" aria-expanded="false" aria-controls="projPop" aria-haspopup="dialog"><span class="proj-ic"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M1.8 4.2a1.2 1.2 0 0 1 1.2-1.2h2.3l1.1 1.4h4.6a1.2 1.2 0 0 1 1.2 1.2v4.4a1.2 1.2 0 0 1-1.2 1.2H3a1.2 1.2 0 0 1-1.2-1.2z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg></span><span class="proj-name" id="projName">Untitled</span><span class="proj-state" id="projState"></span><svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="m3.2 4.6 2.8 2.8 2.8-2.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="pop proj-pop" id="projPop" hidden role="dialog" aria-label="Projects"></div>
  </div>
  <div class="island" id="island">
    <div class="sheets"><div id="islandSheets"></div></div>
    <div class="island-row"><div class="island-in">
      <div class="isl-main" id="islandMain">
        <button class="ebtn icon" id="stepBack" type="button" aria-label="The slide before" data-tip="The slide before – , "><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M7.6 2.4 4 6l3.6 3.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="ebtn" id="play" type="button" aria-label="Pause">Pause</button><button class="ebtn icon" id="stepOn" type="button" aria-label="The next slide" data-tip="The next slide – ."><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.4 2.4 8 6l-3.6 3.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <span class="scrubw"><input id="scrub" type="range" min="0" max="1000" step="1" value="0" aria-label="Position in loop"><span class="ticks" id="ticks" aria-hidden="true"></span></span>
        <span class="act-main" id="time">0.0 / 0.0 s</span>
      </div><span class="ep-div"></span>
      <div class="status" id="toast" role="status" aria-live="polite"></div>
      <button class="ebtn xopen" id="exportOpen" type="button" aria-expanded="false" aria-controls="islandSheets" hidden><span class="t">Export</span><svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="m2.4 6.2 2.6-2.6 2.6 2.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="ebtn" id="exportStop" type="button" hidden><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1.2" fill="currentColor"/></svg>Stop</button>
    </div></div>
  </div>
  <div class="pcap" id="pcap" hidden>
    <div class="sheets"><div id="pcapSheets"></div></div>
    <button class="pc-row" id="pcapOpen" type="button" aria-expanded="false" aria-controls="pcapSheets" data-tip="Presets"><span class="pc-ic"><svg viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="2" width="4" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="8" y="2" width="4" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="2" y="8" width="4" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="8" y="8" width="4" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></span><span class="pc-t">Presets</span><span class="pc-name" id="pcapName"></span><span class="chev"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 8.5 7 5l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
  </div>
  <div class="notice" id="notice" hidden role="status" aria-live="polite"></div>
  <div class="drop" id="drop">Drop images, video or fonts</div>
</div>
<input type="file" id="mediafile" accept="image/*,video/*,.mov,.mp4,.webm,.m4v" multiple class="vh" tabindex="-1">
<input type="file" id="fontfile" accept=".otf,.ttf,.woff,.woff2,font/otf,font/ttf,font/woff,font/woff2" multiple class="vh" tabindex="-1">
<input type="file" id="bgfile" accept="image/*" class="vh" tabindex="-1">
<input type="file" id="ovfile" accept="image/*" class="vh" tabindex="-1">
<input type="file" id="projfile" accept=".segue,.zip,application/zip" class="vh" tabindex="-1">
<input type="file" id="presetfile" accept=".json,application/json" class="vh" tabindex="-1">
