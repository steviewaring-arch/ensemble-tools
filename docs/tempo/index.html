<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tempo — by Ensemble</title>
<link rel="stylesheet" href="https://use.typekit.net/rhx3hsl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;800&display=swap" rel="stylesheet">
<style>
  /* Ensemble tool system – shared tokens with Tutti */
  :root{
    --app:#ffffff; --ground:transparent; --card:#f7f7f5;
    --btn:#ffffff; --btn-hover:#f1f1ef; --seg:#ecebe8;
    --ink:#2b2b2b; --ink-strong:#111111; --muted:#89878e;
    --keyline:rgba(43,43,43,.10); --hair:rgba(43,43,43,.14);
    --fill-ink:#2b2b2b; --on-ink:#ffffff; --focus:#4a7dff;
    --shadow:0 4px 16px rgba(0,0,0,.08);
    --face:"aktiv-grotesk","Aktiv Grotesk","Helvetica Neue",Arial,sans-serif;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    color-scheme:light;
  }
  body[data-theme="dark"]{
    --app:#1c1c1e; --card:#2a2a2e;
    --btn:#34343a; --btn-hover:#3e3e45; --seg:#1e1e22;
    --ink:#f2f1ee; --ink-strong:#ffffff; --muted:#97959c;
    --keyline:rgba(255,255,255,.12); --hair:rgba(255,255,255,.17);
    --fill-ink:#f2f1ee; --on-ink:#1c1c1e;
    --shadow:0 4px 18px rgba(0,0,0,.5); color-scheme:dark;
  }
  *,*::before,*::after{box-sizing:inherit}
  html{font-size:16.75px;height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
  html,body{margin:0}
  body{height:100%;background:var(--ground);color:var(--ink);font-family:var(--face);letter-spacing:-0.023em;line-height:1.2;-webkit-font-smoothing:antialiased;padding:22px}
  button,input,textarea,select{font-family:var(--face);letter-spacing:-0.023em;color:inherit}
  .app{display:flex;width:100%;height:100%;background:var(--app);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);position:relative;transition:background .2s}
  .panel{width:366px;flex:none;min-width:300px;max-width:560px;display:flex;flex-direction:column;min-height:0}
  .brand{flex:none;border-bottom:1px solid var(--keyline);padding:18px 6px 22px 20px}
  .brand .bline{font-size:25px;letter-spacing:-0.045em;line-height:1.05;color:var(--ink-strong);display:flex;align-items:baseline;gap:9px}
  .brand .ver{font-size:25px;color:var(--muted);letter-spacing:-0.03em}
  .brand .caps{letter-spacing:-0.02em}
  .tabs-host{flex:none;padding:14px 22px 2px 20px}
  .scroll{flex:1;overflow-y:auto;padding:14px 22px 14px 20px;min-height:0;
    -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 20px),transparent 100%);mask-image:linear-gradient(to bottom,#000 calc(100% - 20px),transparent 100%)}
  .resizer{flex:none;width:11px;cursor:col-resize;position:relative;background:transparent;touch-action:none}
  .resizer::before{content:"";position:absolute;top:0;bottom:0;left:0;width:1px;background:var(--keyline);transition:.14s}
  .resizer:hover::before{background:var(--muted);width:2px}
  .card{background:var(--card);border-radius:12px;padding:16px 15px 18px;margin-bottom:12px}
  .card>h2{margin:0;font:inherit}
  .card-toggle{all:unset;box-sizing:border-box;cursor:pointer;display:flex;width:100%;justify-content:space-between;align-items:center;font-size:1.2rem;letter-spacing:-0.03em;color:var(--ink-strong);line-height:1;border-bottom:1px solid var(--keyline);padding-bottom:16px;margin-bottom:16px}
  .card-toggle:focus-visible{outline:2px solid var(--focus);outline-offset:4px;border-radius:4px}
  .card.collapsed .card-toggle{border-bottom-color:transparent;padding-bottom:0;margin-bottom:0}
  .chev{font-size:1.2rem;color:var(--muted);line-height:1;width:16px;text-align:center}
  .card.collapsed .card-body{display:none}
  [hidden]{display:none!important}
  .ctl{margin:0 0 14px}
  .ctl-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .ctl-head label,.ctl-head>span:first-child{font-size:0.95rem;color:var(--ink)}
  .ctl-head .val{margin-left:auto;font-size:0.9rem;color:var(--muted);min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:var(--btn);border:1px solid var(--keyline);border-radius:999px;outline:none;margin:0;cursor:pointer;display:block}
  input[type=range]::-webkit-slider-runnable-track{height:32px;background:transparent;border-radius:999px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--fill-ink);margin-top:4px;cursor:pointer;border:0}
  input[type=range]::-moz-range-track{height:32px;background:transparent}
  input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--fill-ink);border:none;cursor:pointer}
  input[type=range]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--seg);border-radius:21px;padding:3px}
  .seg .pill{flex:1 1 auto;border:none;background:var(--btn);color:var(--muted);font-size:0.85rem;padding:9px 10px;border-radius:999px}
  .seg .pill[aria-pressed="true"]{background:var(--fill-ink);color:var(--on-ink)}
  .pill{background:var(--btn);color:var(--ink);border:1px solid var(--keyline);padding:11px 16px;border-radius:999px;font-size:0.95rem;cursor:pointer;transition:.14s;text-align:center;line-height:1.1;white-space:nowrap}
  .pill:hover{background:var(--btn-hover)}
  .pill.small{font-size:0.8rem;color:var(--muted);padding:6px 12px}
  .pill.small:hover{color:var(--ink)}
  .pill[aria-pressed="true"],.pill.primary{background:var(--fill-ink);color:var(--on-ink);border-color:var(--fill-ink)}
  .pill.primary:hover{opacity:.9;background:var(--fill-ink)}
  .pill:disabled{opacity:.4;cursor:default}
  .pill:focus-visible,.toggle:focus-visible,.tab:focus-visible,.lane:focus-visible,.tile:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .btn-row>.pill:not(.small){flex:1}
  .toggle{display:flex;align-items:center;gap:10px;cursor:pointer;margin:0 0 14px;user-select:none;background:none;border:0;padding:0;width:100%;text-align:left;font-size:0.95rem;color:var(--ink)}
  .toggle .box{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--seg)}
  .toggle[aria-checked="true"] .box{background:var(--fill-ink)}
  .toggle[aria-checked="true"] .box::after{content:"";width:5px;height:9px;border:solid var(--on-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translateY(-1px)}
  .colour-row{display:flex;align-items:center;gap:8px;margin:0 0 12px}
  .colour-row label{font-size:0.95rem}
  .colour-row .cw{margin-left:auto;display:flex;align-items:center;gap:10px}
  .colour-row .val{font-size:0.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .cswatch{width:26px;height:26px;flex:none;border:1px solid var(--keyline);border-radius:7px;position:relative;overflow:hidden}
  .cswatch input[type=color]{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:160%;height:160%;border:none;padding:0;cursor:pointer;background:none}
  textarea{width:100%;background:var(--btn);border:1px solid var(--keyline);border-radius:12px;color:var(--ink);font-size:0.95rem;padding:12px 13px;resize:vertical;min-height:62px;line-height:1.3}
  input[type=text],input[type=number]{background:var(--btn);border:1px solid var(--keyline);border-radius:999px;padding:9px 14px;font-size:0.9rem;color:var(--ink);width:100%}
  textarea:focus-visible,input[type=text]:focus-visible,input[type=number]:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .hint{font-size:0.82rem;line-height:1.5;color:var(--muted);margin:2px 0 14px}
  .sub-head{font-size:0.85rem;color:var(--muted);margin:4px 0 12px;letter-spacing:0}
  .switch-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .slot{display:flex;align-items:center;gap:8px;padding:0 0 12px;margin-bottom:12px;border-bottom:1px solid var(--keyline)}
  .slot:last-of-type{border-bottom:0}
  .slot.drag{outline:2px dashed var(--fill-ink);outline-offset:4px;border-radius:8px}
  .slot-main{flex:1;min-width:0}
  .slot-label{color:var(--muted);font-size:0.78rem;margin-bottom:3px}
  .slot-name{font-size:0.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .slot-meta{color:var(--muted);font-size:0.78rem;margin-top:3px}
  .preset-list{display:flex;flex-direction:column;gap:7px;margin:4px 0 14px}
  .preset-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--btn);border:1px solid var(--keyline)}
  .preset-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:0.92rem}
  .progress{height:6px;background:var(--seg);border-radius:999px;overflow:hidden;margin:4px 0 14px}
  .progress>i{display:block;height:100%;width:0;background:var(--fill-ink);border-radius:999px}
  .tfield{margin:0 0 12px}
  .tfield-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;color:var(--muted);font-size:0.82rem}
  .pick-host{margin-top:6px}
  .pick-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--keyline)}
  .pick-ch{width:16px;flex:none;color:var(--muted);padding-top:13px;font-size:0.9rem}
  .tiles{display:flex;flex-wrap:wrap;gap:5px}
  .tile{border:1px solid var(--keyline);padding:0;border-radius:9px;background:var(--btn);cursor:pointer;position:relative;width:38px;height:46px;display:block}
  .tile canvas{display:block;width:36px;height:44px;pointer-events:none}
  .tile[aria-pressed="true"]{background:var(--fill-ink);border-color:var(--fill-ink)}
  .tile.rest::after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--on-ink)}
  .img-row{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .img-row .slot-name{flex:1;min-width:0}
  details{margin-top:4px}details summary{cursor:pointer;font-size:0.9rem;color:var(--ink);margin-bottom:6px}
  details .hint p{margin:8px 0}
  details code{font-size:0.78rem;background:var(--btn);border:1px solid var(--keyline);padding:1px 6px;border-radius:6px;word-break:break-all}
  /* tabs = Tutti lanes */
  .tabs,.lanes{display:flex;background:var(--seg);border-radius:999px;padding:3px;gap:2px}
  .tab,.lane{flex:1;border:none;background:transparent;color:var(--muted);font-size:0.92rem;padding:8px 16px;border-radius:999px;cursor:pointer;transition:.14s;white-space:nowrap}
  .lane{font-size:0.8rem;padding:6px 12px}
  .tab[aria-pressed="true"],.lane[aria-pressed="true"]{background:var(--btn);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
  /* stage */
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:54px 30px 92px;min-width:0;min-height:0;background:var(--app);position:relative;transition:background .2s}
  .view{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
  #cv{display:block;box-shadow:0 0 0 1px var(--keyline)}
  #cv.checker{background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
  .stage-foot{position:absolute;left:22px;top:16px;display:flex;gap:8px;align-items:center;font-size:0.78rem;color:var(--muted);font-variant-numeric:tabular-nums;z-index:5;flex-wrap:wrap;max-width:calc(100% - 120px)}
  .stage-foot span{background:var(--card);border:1px solid var(--keyline);border-radius:999px;padding:6px 12px;line-height:1}
  .stage-foot span:empty{display:none}
  .appearance{position:absolute;right:20px;top:14px;display:flex;gap:4px;z-index:5}
  .appearance button{width:28px;height:28px;border:none;background:transparent;color:var(--muted);cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:.14s}
  .appearance button:hover{color:var(--ink);background:var(--btn-hover)}
  .appearance button.on{color:var(--ink-strong)}
  .capsule{position:absolute;left:0;right:0;bottom:16px;margin:0 auto;width:fit-content;display:flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:10px;background:var(--card);border:1px solid var(--keyline);border-radius:28px;padding:8px 14px;z-index:5;max-width:calc(100% - 44px)}
  .ebtn{border:1px solid var(--keyline);background:var(--btn);color:var(--ink);font-size:0.95rem;padding:8px 15px;border-radius:999px;cursor:pointer;transition:.14s;white-space:nowrap}
  .ebtn:hover{background:var(--btn-hover)}
  .ebtn:disabled{opacity:.4;cursor:default}
  .ep-title{font-size:1.1rem;letter-spacing:-0.03em;color:var(--ink-strong);padding:0 4px 0 2px}
  .ep-div{width:1px;height:22px;background:var(--keyline);margin:0 2px}
  .act-main{font-size:0.9rem;color:var(--muted);letter-spacing:-0.02em;font-variant-numeric:tabular-nums;min-width:86px;text-align:right}
  #scrub{width:200px;height:26px}
  #scrub::-webkit-slider-runnable-track{height:24px}
  #scrub::-webkit-slider-thumb{width:18px;height:18px;margin-top:3px}
  #scrub::-moz-range-thumb{width:18px;height:18px}
  .saver-only{display:none!important}
  body.saver .saver-only{display:flex!important}
  body.saver .studio-only{display:none!important}
  .drop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--app) 85%,transparent);font-size:1.4rem;letter-spacing:-0.03em;z-index:8;pointer-events:none}
  .drop.on{display:flex}
  .status{position:absolute;right:22px;bottom:78px;font-size:0.8rem;letter-spacing:-0.02em;color:var(--on-ink);background:var(--fill-ink);border-radius:999px;padding:8px 14px;opacity:0;transition:opacity .4s;pointer-events:none;z-index:6;max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:var(--shadow)}
  .status.on{opacity:1}
  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  /* v0.7 */
  .toggle-row{display:flex;align-items:center;gap:6px;margin:0 0 14px}
  .toggle-row .toggle{margin:0;width:auto}
  .q{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--hair);background:none;color:var(--muted);font-family:var(--face);font-size:0.68rem;line-height:1;padding:0;margin-left:2px;cursor:help;flex:none;font-style:normal;letter-spacing:0}
  .q:hover,.q:focus-visible{border-color:var(--ink);color:var(--ink)}
  .q:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .colour-row .q{margin-left:6px}
  .tip{position:fixed;left:0;top:0;pointer-events:none;background:var(--ink-strong);color:var(--app);padding:10px 12px;border-radius:9px;font-size:0.78rem;letter-spacing:-0.02em;max-width:240px;line-height:1.45;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.28);opacity:0;transition:opacity .1s}
  .tip.on{opacity:1}
  .slot{display:block}
  .slot-top{display:flex;align-items:center;gap:8px}
  .slot .toggle-row{margin:12px 0 0}
  .axes{margin-top:14px}
  .axes .ctl:last-child{margin-bottom:0}
  .card.drag{outline:2px dashed var(--fill-ink);outline-offset:-6px}
  select{width:100%;background:var(--btn);color:var(--ink);border:1px solid var(--keyline);padding:10px 14px;border-radius:999px;font-size:0.95rem;cursor:pointer}
  select:hover{background:var(--btn-hover)}
  select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .ebtn.icon{padding:8px 9px;display:inline-flex;align-items:center;margin-left:-6px}
  .ebtn.icon[aria-expanded="true"]{background:var(--fill-ink);color:var(--on-ink);border-color:var(--fill-ink)}
  .rand-pop{position:absolute;bottom:76px;left:50%;transform:translateX(-50%);width:320px;max-width:calc(100% - 32px);background:var(--card);border:1px solid var(--keyline);border-radius:16px;padding:16px 15px;z-index:7;box-shadow:var(--shadow)}
  .rp-title{font-size:1.1rem;letter-spacing:-0.03em;color:var(--ink-strong);margin-bottom:12px}
  .rand-pop .lanes{margin-bottom:10px}
  .rp-groups{display:grid;grid-template-columns:1fr 1fr;gap:10px 8px;margin:0 0 16px}
  .rp-groups .toggle{margin:0}
  .rand-pop .pill.primary{width:100%}
  .rand-pop .hint:last-child{margin:12px 0 0}
  @media(max-width:860px){
    body{padding:0;height:auto}
    .app{flex-direction:column;border-radius:0;box-shadow:none;height:auto;overflow:visible}
    .panel{width:100%!important;max-width:none}
    .resizer{display:none}
    .scroll{-webkit-mask-image:none;mask-image:none;overflow:visible}
    .stage{order:-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:9;height:min(60vh,560px);padding:46px 12px 78px}
    #scrub{width:120px}
  }
  @media (prefers-reduced-motion: reduce){.toggle .box,.status,.pill{transition:none}}
</style>
<script src="https://cdn.jsdelivr.net/npm/opentype.js@2.0.0/dist/opentype.min.js"></script>

<body data-theme="dark">
<div class="app">
  <aside class="panel" id="panelBox">
    <div class="brand">
      <div class="bline"><span class="mark">Tempo</span><span class="ver">0.3</span></div>
      <div class="bline caps">By ENSEMBLE</div>
    </div>
    <div class="scroll" id="panel" aria-label="Controls"></div>
  </aside>
  <div class="resizer" id="resizer" aria-hidden="true"></div>
  <main class="stage" id="stage">
    <div class="view" id="view"><canvas id="cv" width="1080" height="1080" aria-label="Screen saver preview"></canvas></div>
    <div class="stage-foot"><span id="dims"></span><span id="note"></span></div>
    <div class="appearance" id="appearance">
      <button data-t="light" title="Light mode" aria-label="Light mode"><svg viewBox="0 0 16 16" width="15" height="15"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <button data-t="dark" title="Dark mode" aria-label="Dark mode"><svg viewBox="0 0 16 16" width="15" height="15"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2.4 A5.6 5.6 0 0 1 8 13.6 Z" fill="currentColor"/></svg></button>
    </div>
    <div class="drop" id="drop">Drop fonts</div>
    <div class="status" id="toast" role="status" aria-live="polite"></div>
  </main>
</div>
<input type="file" id="fontfile" accept=".otf,.ttf,.woff,font/otf,font/ttf,font/woff" multiple class="vh" tabindex="-1">
<input type="file" id="imgfile" accept="image/png,image/jpeg,image/webp,image/gif" class="vh" tabindex="-1">
<script id="tempo-engine">
function createEngine(){
'use strict';
let S={},img=null,hooks=null,live=null;
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
const E={
  cubicOut:t=>1-Math.pow(1-t,3), cubicIn:t=>t*t*t,
  expoOut:t=>t>=1?1:1-Math.pow(2,-10*t), expoIn:t=>t<=0?0:Math.pow(2,10*t-10),
  expoInOut:t=>t<=0?0:t>=1?1:t<.5?Math.pow(2,20*t-10)/2:(2-Math.pow(2,-20*t+10))/2,
  inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  backOut:(t,s=1.70158)=>{const u=t-1;return 1+(s+1)*u*u*u+s*u*u},
  backIn:(t,s=1.70158)=>(s+1)*t*t*t-s*t*t,
};
const easeOut=(n,t)=>n==='expo'?E.expoOut(t):n==='back'?E.backOut(t):n==='linear'?t:E.cubicOut(t);
const easeIn=(n,t)=>n==='expo'?E.expoIn(t):n==='back'?E.backIn(t):n==='linear'?t:E.cubicIn(t);
const qEase=t=>S.qEase==='smooth'?E.inOut(t):S.qEase==='elastic'?E.backOut(t,1.5):E.expoInOut(t);

function hash(a,b,c,d){let x=Math.imul((S.seed|0)+0x632be5ab,0x9E3779B1);for(const v of [a,b,c,d]){x^=((v|0)+0x7f4a7c15+(x<<6)+(x>>>2));x=Math.imul(x^(x>>>16),0x85ebca6b);x=Math.imul(x^(x>>>13),0xc2b2ae35);x^=x>>>16;}return (x>>>0)/4294967296;}

setConfig(C);

function saverChars(cfg){
  const chars=new Set(' 0123456789,:.apmAPM');
  const add=s=>{for(const ch of Array.from(s||''))if(ch!=='\n'){chars.add(ch);chars.add(ch.toUpperCase());chars.add(ch.toLowerCase());}};
  for(let i=0;i<7;i++)add(new Date(2026,0,5+i).toLocaleDateString('en-GB',{weekday:'long'}));
  for(let m=0;m<12;m++)add(new Date(2026,m,1).toLocaleDateString('en-GB',{month:'long'}));
  if(cfg.words)add(saverVocab());
  return chars;
}

function bakeFonts(chars){
  const out=[];
  for(const {id,face:f,swap} of eng.faceList()){if(!f||f.fallback)continue;
    const d={id,swap,name:f.name,family:f.family,upm:f.upm,asc:f.asc,desc:f.desc,cap:f.cap,wc:f.weightClass,cmap:{},alts:{},glyphs:{},kern:{}};const ids=new Set();
    for(const ch of chars){const g=f.base(ch);if(!g)continue;d.cmap[ch]=g;ids.add(g);const al=f.alts(ch);if(al.length){d.alts[g]=al.slice();al.forEach(a=>ids.add(a));}}
    for(const g of ids)d.glyphs[g]={d:f.pathD(g),a:f.adv(g),n:f.glyphName(g),b:f.bbox?f.bbox(g):null};
    const arr=[...ids];for(const x of arr)for(const y of arr){const k=f.kern(x,y);if(k)d.kern[x+','+y]=k;}
    out.push(d);}
  return out;
}

  try{
    const name=exportName().replace(/[^A-Za-z0-9 \-]/g,'').trim()||'Tempo';
    const res=await SaverPack.build(SAVER_ASSETS,{name,html:saverHTML(),thumbs:saverThumbs(),readme:macReadme(name)});
    await saveFile(name+' screen saver for Mac.zip',res.blob);
  }catch(e){console.error(e);toast('Couldn\u2019t build the Mac file: '+(e.message||e));}
  finally{btn.disabled=false;btn.textContent=label;ssDirty=true;}
}
function winReadme(name){return `${name} screen saver for Windows
=======================================

1. Before unzipping: right-click the zip > Properties > tick "Unblock" > OK.
   (This stops Windows treating the screen saver as unsafe. If there's no
   Unblock box, carry on.) Then right-click > Extract All.

2. Move "${name}.scr" somewhere it can stay, such as your Documents folder.
   Windows runs it from wherever it is when you install it.

3. Right-click "${name}.scr" and choose Install. Screen Saver Settings opens
   with ${name} selected. Set the wait time and click OK.
   If "Windows protected your PC" appears, click More info > Run anyway.

It plays full screen through Microsoft Edge, which is built into Windows 10
and 11. Your main display shows the clock; other displays show the
background colour. Move the mouse or press a key to wake.

To remove it, choose another screen saver in Screen Saver Settings, then
delete "${name}.scr".

Made with Tempo by Ensemble.
`.replace(/\n/g,'\r\n');}
function saverBg(cfg){if(cfg.words){const w=cfg.words;return w.rotate?w.themes[new Date().getHours()%w.themes.length].bg:w.bg;}return cfg.colours.cycle?cfg.palettes[new Date().getHours()%cfg.palettes.length].bg:cfg.colours.bg;}
async function exportWin(){
  if(!window.SaverPack||!window.SAVER_WIN){toast("The Windows packager didn't load. Reload and try again.");return;}
  const btn=window.winBtn;btn.disabled=true;const label=btn.textContent;btn.textContent='Building\u2026';
  try{
    const name=exportName().replace(/[^A-Za-z0-9 \-]/g,'').trim()||'Tempo';
    const enc=new TextEncoder(),nb=enc.encode(name),hb=enc.encode(saverHTML());
    const bin=atob(SAVER_WIN),tpl=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)tpl[i]=bin.charCodeAt(i);
    const hex=/^#?([0-9a-f]{6})$/i.exec(saverBg(saverConfig())),bg=hex?parseInt(hex[1],16):0;
    const ft=new Uint8Array(24),dv=new DataView(ft.buffer);ft.set(enc.encode('RBTOSCR1'));dv.setUint32(8,nb.length,true);dv.setUint32(12,hb.length,true);dv.setUint32(16,bg,true);
    const scr=new Uint8Array(tpl.length+nb.length+hb.length+24);scr.set(tpl,0);scr.set(nb,tpl.length);scr.set(hb,tpl.length+nb.length);scr.set(ft,tpl.length+nb.length+hb.length);
    await saveFile(name+' screen saver for Windows.zip',SaverPack.zip([{path:name+'.scr',data:scr},{path:'Read me first.txt',data:enc.encode(winReadme(name))}]));
  }catch(e){console.error(e);toast('Couldn\u2019t build the Windows file: '+(e.message||e));}
  finally{btn.disabled=false;btn.textContent=label;ssDirty=true;}
}
const SS_BOOT=`(function(){
var C=window.__TEMPO__,eng=createEngine();
eng.setFaces((C.fonts||[]).map(function(d){return{id:d.id,face:eng.makeBaked(d),swap:d.swap!==false};}));
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),sv=createSaver(eng,C),last=0;
function size(){var dpr=Math.min(window.devicePixelRatio||1,2),w=Math.round(innerWidth*dpr),h=Math.round(innerHeight*dpr),cap=2880/Math.max(w,h);if(cap<1){w=Math.round(w*cap);h=Math.round(h*cap);}if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}}
function tick(now){var dt=last?Math.min(100,now-last):0;last=now;size();sv.frame(ctx,cv.width,cv.height,now,dt);document.body.style.background=sv.bg();requestAnimationFrame(tick);}
requestAnimationFrame(tick);
document.addEventListener('click',function(){if(!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(function(){});});
})();`;

/* ---------------- preview ---------------- */
/* The preview takes the shape of the screen Tempo is open on. */
function screenShape(){const w=Math.round((window.screen&&screen.width)||0),h=Math.round((window.screen&&screen.height)||0);return w>99&&h>99?[w,h]:[1680,1050];}
function fitCanvas(){
  const [W,H]=screenShape();if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
  const v=$('#view'),cs=getComputedStyle(v);
  const aw=v.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ah=v.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const s=Math.max(.01,Math.min(aw/W,ah/H));cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';
  cv.classList.toggle('checker',!!S.transparent);
  $('#dims').textContent='Preview at '+W+' × '+H+', the shape of this screen, showing your local time';dirty=true;
}
let pEng=null,saver=null,pFonts=-1;
function previewFrame(now,dt){
  if(!pEng)pEng=createEngine();
  if(pFonts!==faceVer){pEng.setFaces(eng.faceList());pFonts=faceVer;ssDirty=true;}
  if(!saver){saver=createSaver(pEng,saverConfig());ssDirty=false;}else if(ssDirty){saver.setConfig(saverConfig());ssDirty=false;}
  saver.frame(ctx,cv.width,cv.height,now,dt);
}
function tick(now){
  const dt=lastT?Math.min(100,now-lastT):0;lastT=now;
  const P=screenShape();if(cv.width!==P[0]||cv.height!==P[1])fitCanvas();try{previewFrame(now,dt);}catch(e){console.error(e);}dirty=true;requestAnimationFrame(tick);
}
function applyTab(){document.body.classList.add('saver');refreshVis();fitCanvas();}

/* ---------------- start ---------------- */
function appStart(){refreshFontCard();themesRefresh();applyTab();refreshAll();fitCanvas();}
/* Ensemble Tools – shared core, end part. Runs after the app's own files (see core.js). */
/* ---------------- downloads ---------------- */
let dlNs=null;const dlReady=(window.claude&&typeof claude.use==='function')?claude.use('downloads').then(n=>dlNs=n).catch(()=>null):Promise.resolve(null);
async function saveFile(name,blob){
  if(window.claude&&typeof claude.use==='function'){await dlReady;
    if(dlNs){try{await dlNs.save({filename:name,data:blob});toast(`Saved ${name}`);}catch(e){const c=e&&e.code;toast(c==='declined'?'Download cancelled':c==='rate_limited'?'A download is already waiting for you. Try again in a moment.':c==='too_large'?'That file is too large. Try a smaller size.':`Couldn't save ${name}.`);}return;}}
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast(`Saved ${name}`);
}
function slug(){const t=(S.texts[0]||'type').split('\n')[0].toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'type';return t.slice(0,32)+'-'+({none:'still',fluid:'fluid',snappy:'snappy',transit:'transitional'}[S.mode]||'motion');}

/* ---------------- misc wiring ---------------- */
let toastT=0;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2800);}
$('#fontfile').onchange=e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)loadFiles(fs);};
$('#imgfile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)setImage(f,f.name);};
let dragDepth=0;
window.addEventListener('dragenter',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){dragDepth++;$('#drop').classList.add('on');}});
window.addEventListener('dragleave',()=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$('#drop').classList.remove('on');});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{e.preventDefault();dragDepth=0;$('#drop').classList.remove('on');const fs=[...(e.dataTransfer?e.dataTransfer.files:[])];if(!fs.length)return;
  const ims=fs.filter(f=>/^image\//.test(f.type));const fo=fs.filter(f=>!/^image\//.test(f.type));if(ims.length)setImage(ims[0],ims[0].name);if(fo.length)loadFiles(fo);});
function setTheme(t){document.body.dataset.theme=t;LS.set('theme',t);document.querySelectorAll('#appearance button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));schedulePicker(0);}
document.querySelectorAll('#appearance button').forEach(b=>b.onclick=()=>setTheme(b.dataset.t));
setTheme(LS.get('theme')==='light'?'light':'dark');
{const rz=$('#resizer'),box=$('#panelBox'),pw=LS.get('panelW');if(pw)box.style.width=pw+'px';
  rz.addEventListener('pointerdown',e=>{e.preventDefault();rz.setPointerCapture(e.pointerId);const x0=e.clientX,w0=box.offsetWidth;
    const mv=ev=>{box.style.width=clamp(w0+ev.clientX-x0,300,560)+'px';};
    rz.addEventListener('pointermove',mv);rz.addEventListener('pointerup',()=>{rz.removeEventListener('pointermove',mv);LS.set('panelW',box.offsetWidth);},{once:true});});}

appStart();
if(document.fonts){document.fonts.load(`400 100px ${FAMILY}`).then(()=>document.fonts.load(`800 100px ${FAMILY}`)).then(()=>{fallbacks.d1.reset();fallbacks.d2.reset();dirty=true;schedulePicker(0);}).catch(()=>{});}
restoreFonts();
