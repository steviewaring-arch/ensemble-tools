<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Decentish</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@700&display=swap">
<style>
/* Decentish 0.4. One face, one weight. The dial only changes colour: white, amber, red.
   The plan sits top left. Controls and the sober receipts sit at the foot, and the receipts never change colour. */
@font-face{font-family:"Diatype Bold";src:local("ABC Diatype Bold"),local("ABCDiatype-Bold"),url("ABCDiatype-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
:root{
  --face:"Diatype Bold","Hanken Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  --paper:#ffffff;
  --ink:#121212;
  --sober-paper:#ffffff;
  --sober-ink:#121212;
  --sober-soft:#5d5b56;
  --gutter:clamp(16px,4.5vw,44px);
  --voice:clamp(26px,4.6vw,54px);
  color-scheme:light;
}
body[data-dial="0"]{--paper:#ffffff}
body[data-dial="1"]{--paper:#f3b419}
body[data-dial="2"]{--paper:#ff4a2e}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--face);font-weight:700;letter-spacing:-.022em;-webkit-font-smoothing:antialiased;transition:background-color .6s ease}
.page{min-height:100%;display:flex;flex-direction:column}
.voice{flex:1;padding-inline:var(--gutter);padding-block:calc(var(--gutter) + env(safe-area-inset-top,0px)) var(--gutter)}
#lines p{margin:0 0 .45em;font-size:var(--voice);line-height:1.06;max-width:18em;overflow-wrap:break-word}
#lines p.in{animation:land .5s ease both}
#lines p.loading{animation:breathe 1.4s ease-in-out infinite}
@keyframes land{from{opacity:0;transform:translateY(.22em)}to{opacity:1;transform:none}}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:.22}}
.ask{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:1.1em;font-size:18px}
.ask form{display:flex;flex-wrap:wrap;gap:8px}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
.btn{background:transparent;border:2px solid currentColor;padding:9px 14px;cursor:pointer;border-radius:0}
.btn:hover,.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.field{background:transparent;border:2px solid currentColor;padding:9px 12px;border-radius:0;width:9.5em;min-width:0}
.field::placeholder{color:currentColor;opacity:.45}
:focus-visible{outline:3px solid currentColor;outline-offset:3px}
.desk{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 22px;padding-inline:var(--gutter);padding-block:10px 18px;font-size:14px}
.when{display:flex}
.when .btn{font-size:16px}
.when .btn+.btn{border-left-width:0}
.dial{flex:1 1 200px;min-width:0}
.dial label{display:block;font-size:18px;margin-bottom:8px}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:30px;margin:0;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;margin-top:-11px;background:var(--ink);border:0;border-radius:0}
input[type=range]::-moz-range-track{height:2px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;background:var(--ink);border:0;border-radius:0}
.ends{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin-top:2px}
.facts{background:var(--sober-paper);color:var(--sober-ink);border-top:2px solid var(--sober-ink);padding-inline:var(--gutter);padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));font-size:13px;line-height:1.45;font-variant-numeric:tabular-nums;display:grid;gap:6px}
.facts p{margin:0}
.soft{color:var(--sober-soft)}
.tools{display:flex;flex-wrap:wrap;gap:6px 18px}
.link{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lab{display:grid;gap:10px;padding-top:6px}
.lab form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lab .field{width:auto;padding:7px 10px;border-width:1.5px}
.lab .btn{padding:7px 12px;border-width:1.5px}
.lab .btn:hover{background:var(--sober-ink);color:var(--sober-paper)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.workings{display:grid;gap:4px;padding-top:6px}
.workings ol{margin:0;padding-left:1.4em;display:grid;gap:2px}
@media (prefers-reduced-motion:reduce){#lines p.in,#lines p.loading{animation:none}body{transition:none}}
</style>
</head>
<body data-dial="1">
<div class="page">
  <main class="voice">
    <div id="lines" aria-live="polite"></div>
    <div class="ask" id="ask" hidden>
      <button class="btn" id="useLocation" type="button">Use my location</button>
      <form id="askForm" autocomplete="off">
        <input class="field" id="askPostcode" name="postcode" placeholder="Postcode" aria-label="Postcode" autocapitalize="characters">
        <button class="btn" type="submit">Go</button>
      </form>
    </div>
  </main>
  <section class="desk" aria-label="Controls">
    <div class="when" role="group" aria-label="When">
      <button class="btn" type="button" data-when="now" aria-pressed="true">Now</button>
      <button class="btn" type="button" data-when="soon" aria-pressed="false">Soon</button>
      <button class="btn" type="button" data-when="tomorrow" aria-pressed="false">Tomorrow</button>
    </div>
    <div class="dial">
      <label for="dial" id="dialName">Three pints and a meal deal</label>
      <input type="range" id="dial" min="0" max="2" step="1" value="1">
      <div class="ends" aria-hidden="true"><span>Culture trip</span><span>Mad one</span></div>
    </div>
    <div class="dial">
      <label for="dist" id="distName">Nearby</label>
      <input type="range" id="dist" min="0" max="2" step="1" value="1">
      <div class="ends" aria-hidden="true"><span>Doorstep</span><span>Further afield</span></div>
    </div>
    <button class="btn" id="refresh" type="button">Another plan</button>
  </section>
  <footer class="facts">
    <p id="receipts"></p>
    <p id="facts">Decentish 0.4</p>
    <p class="soft" id="timings"></p>
    <p class="soft">Tram and taxi times are estimates, not timetables. Not wired up yet: live trams, trains, buses, film times, gigs, ratings, hygiene.</p>
    <div class="tools">
      <button class="link soft" id="workingsToggle" type="button" aria-expanded="false">Workings</button>
      <button class="link soft" id="labToggle" type="button" aria-expanded="false">Test</button>
    </div>
    <div class="workings" id="workings" hidden></div>
    <div class="lab" id="lab" hidden>
      <form id="labForm" autocomplete="off">
        <input class="field" id="tPostcode" placeholder="Postcode" aria-label="Test postcode" autocapitalize="characters">
        <input class="field" id="tAt" type="datetime-local" aria-label="Test day and time">
        <button class="btn" type="submit">Run test</button>
        <button class="btn" id="tClear" type="button">Back to real</button>
      </form>
      <div class="presets">
        <button class="btn" type="button" data-preset="fri">Friday 17:30</button>
        <button class="btn" type="button" data-preset="sat">Saturday 23:00</button>
        <button class="btn" type="button" data-preset="sun">Sunday 10:00</button>
        <button class="btn" type="button" data-preset="small">Tonight 03:00</button>
        <button class="btn" type="button" data-preset="nq">Northern Quarter, M4 1HN</button>
        <button class="btn" type="button" data-preset="remote">Barra, HS9</button>
      </div>
      <p class="soft">Test runs use real data for that place and time. Weather covers yesterday to a week ahead.</p>
    </div>
  </footer>
</div>
<script>
(()=>{
'use strict';
const VERSION='0.4';
const $=s=>document.querySelector(s);

/* ---------- Settings ---------- */
const NEAR_M=1300;                            // everything, hours or not: the doorstep and the workings
const RING_M=3000;                            // places with hours, parks and tram stops: about two miles
const WIDE_M=16000;                           // only when nothing is local
const HUB_KM=[3.5,16];                        // further afield: places this far away are fetched as destinations
const GM=['Bolton','Bury','Manchester','Oldham','Rochdale','Salford','Stockport','Tameside','Trafford','Wigan'];
/* Destinations worth the trip. Centre points only; what's there comes from the map. Town is always one of them. */
const HUBS=[
  {key:'town',name:'town',lat:53.4808,lon:-2.2369,r:1100},
  {key:'quays',name:'Salford Quays',lat:53.4712,lon:-2.2970,r:700},
  {key:'chorlton',name:'Chorlton',lat:53.4428,lon:-2.2770,r:700},
  {key:'didsbury',name:'Didsbury',lat:53.4166,lon:-2.2310,r:600},
  {key:'prestwich',name:'Prestwich',lat:53.5325,lon:-2.2855,r:500},
  {key:'sale',name:'Sale',lat:53.4245,lon:-2.3215,r:500},
  {key:'altrincham',name:'Altrincham',lat:53.3872,lon:-2.3500,r:600},
  {key:'stockport',name:'Stockport',lat:53.4092,lon:-2.1580,r:600},
  {key:'levenshulme',name:'Levenshulme',lat:53.4445,lon:-2.1925,r:500},
  {key:'monton',name:'Monton',lat:53.4905,lon:-2.3505,r:400},
  {key:'bury',name:'Bury',lat:53.5928,lon:-2.2965,r:500},
  {key:'ramsbottom',name:'Ramsbottom',lat:53.6478,lon:-2.3168,r:400}
];
const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter'];
const LIBS=[
  ['https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.min.js','https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js'],
  ['https://cdn.jsdelivr.net/npm/opening_hours@3.15.0/build/opening_hours.min.js','https://cdn.jsdelivr.net/npm/opening_hours@3.15.0/build/opening_hours.js']
];
const store={
  get(k){try{return localStorage.getItem('decentish:'+k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem('decentish:'+k,String(v))}catch(e){}}
};

/* ---------- Getting about: estimates until live times are wired up ----------
   Trams: about 2.2 minutes a stop, a 6-minute wait, 8 more for a change. Last trams around midnight.
   Taxis: roads 1.3 times the straight line at 28 km/h, plus 3 minutes; £3.50 plus £1.60 a road kilometre. */
const TRAM={hop:2.2,wait:6,change:8,first:6,last:23.5,warn:23};
const TAXI={pickup:3,road:1.3,kmh:28,flag:3.5,perKm:1.6};
/* Metrolink, stop by stop. Positions come from the map; this is just which stop follows which. */
const METROLINK=[
  ['Victoria','Shudehill','Market Street','Piccadilly Gardens','Piccadilly'],
  ['Victoria','Exchange Square',"St Peter's Square"],
  ['Piccadilly Gardens',"St Peter's Square",'Deansgate-Castlefield','Cornbrook'],
  ['Piccadilly','New Islington','Holt Town','Etihad Campus','Velopark','Clayton Hall','Edge Lane','Cemetery Road','Droylsden','Audenshaw','Ashton Moss','Ashton West','Ashton-under-Lyne'],
  ['Victoria','Queens Road','Abraham Moss','Crumpsall','Bowker Vale','Heaton Park','Prestwich',"Besses o' th' Barn",'Whitefield','Radcliffe','Bury'],
  ['Victoria','Monsall','Central Park','Newton Heath and Moston','Failsworth','Hollinwood','South Chadderton','Freehold','Westwood','Oldham King Street','Oldham Central','Oldham Mumps','Derker','Shaw and Crompton','Newhey','Milnrow','Kingsway Business Park','Newbold','Rochdale Railway Station','Rochdale Town Centre'],
  ['Cornbrook','Trafford Bar','Old Trafford','Stretford','Dane Road','Sale','Brooklands','Timperley','Navigation Road','Altrincham'],
  ['Trafford Bar','Firswood','Chorlton',"St Werburgh's Road",'Withington','Burton Road','West Didsbury','Didsbury Village','East Didsbury'],
  ["St Werburgh's Road",'Barlow Moor Road','Sale Water Park','Northern Moor','Wythenshawe Park','Moor Road','Baguley','Roundthorn','Martinscroft','Benchill','Crossacres','Wythenshawe Town Centre','Robinswood Road','Peel Hall','Shadowmoss','Manchester Airport'],
  ['Cornbrook','Pomona','Exchange Quay','Salford Quays','Anchorage','Harbour City','Broadway','Langworthy','Weaste','Ladywell','Eccles'],
  ['Harbour City','MediaCityUK'],
  ['Pomona','Wharfside','Imperial War Museum','Village','Parkway','Barton Dock Road','EventCity','The Trafford Centre']
];
const CITY_STOPS=['Victoria','Shudehill','Market Street','Piccadilly Gardens','Piccadilly','Exchange Square',"St Peter's Square",'Deansgate-Castlefield'];

/* ---------- The dial: three profiles ----------
   Each stop decides what gets picked, how late, how many steps, and what counts as good. How far is the distance dial's job.
   Steps are lists of roles in order of preference; '-' makes a step optional. Stays are minutes spent at each kind of place.
   q weighs the quality signals: chain, real ale, heritage, free entry, sitting outside, independent. */
const PROFILES=[
  {key:'blair',name:'Tony Blair on a culture trip',endHour:22.5,tomorrow:[18,11],
   avoid:p=>p.kind==='fast_food'||p.role==='shop',strict:true,taxiSlack:10,max:3,
   steps:s=>{const h=s.getHours();return h<16?[['culture','park'],['cafe','food'],['culture','park','cafe']]:h>=21?[['bar','pub']]:[['culture','park','-'],['food'],['bar','pub']]},
   stay:{culture:75,park:40,cafe:40,food:75,pub:45,bar:45,club:60,activity:60,shop:5},
   q:{chain:-4,indie:1,ale:1,heritage:3,free:1.5,outdoor:2,pick:3},
   hubPref:h=>h.key==='town'||h.key==='quays'?3:0},
  {key:'pints',name:'Three pints and a meal deal',endHour:24.5,tomorrow:[17.5,13],taxiSlack:20,max:4,
   steps:s=>{const h=s.getHours();return h>=5&&h<11?[['cafe'],['park','culture','activity','-'],['pub','bar'],['food','shop']]:h>=11&&h<16?[['pub','bar'],['activity','park','culture','-'],['food','shop'],['pub','bar']]:[['pub','bar'],['food','shop'],['activity','pub','bar']]},
   stay:{culture:45,park:30,cafe:30,food:45,pub:75,bar:60,club:60,activity:60,shop:5},
   q:{chain:-1,indie:.5,ale:2,heritage:1.5,free:0,outdoor:2,pick:3},
   hubPref:h=>h.key==='town'?1:0},
  {key:'mad',name:'Pissed-up uncle on a mad one',endHour:30,tomorrow:[17.5,14],late:true,taxiSlack:20,foodAfter:23,max:5,
   steps:s=>{const h=s.getHours();return h>=1&&h<6?[['club','bar','pub','food']]:[['pub','bar'],['bar','activity','pub'],['bar','pub','club'],['club','bar'],['food']]},
   stay:{culture:20,park:15,cafe:15,food:25,pub:65,bar:65,club:120,activity:50,shop:5},
   q:{chain:0,indie:0,ale:1,heritage:.5,free:0,outdoor:1,pick:2},
   hubPref:(h,s)=>h.key==='town'&&(s.getHours()>=19||s.getHours()<5)?5:0}
];
/* The distance dial.
   Doorstep: first stop within 10 minutes' walk, the rest within 6 of each other, nothing more than 12 from your door.
   Nearby: somewhere you wouldn't call the doorstep, up to about two miles – walk, or a taxi or tram if it's far – then stops within 15 minutes of each other.
   Further afield: a destination (town, Chorlton, the Quays…), there and back by tram or taxi, stops within 15 minutes of each other. */
const DIST=[
  {name:'On the doorstep',first:10,hop:6,home:12},
  {name:'Nearby',first:25,hop:15,ride:true,beyond:11},
  {name:'Further afield',hub:true,hop:15}
];
const MINSTAY={culture:45,park:20,cafe:20,food:30,pub:10,bar:10,club:30,activity:30,shop:5};
const WHENS=['now','soon','tomorrow'];

/* ---------- Picks: places worth saying something about. Steve's list to grow. ----------
   Keyed by name. Each note is a verb phrase that follows "it": "it is a green-tiled Victorian pub". */
const PICKS={
  'Peveril of the Peak':'is a green-tiled Victorian pub',
  "Sam's Chop House":'is a Victorian chop house',
  "Mr Thomas's Chop House":'is a Victorian chop house',
  'Marble Arch':'has a sloping mosaic floor and its own brewery',
  "The Briton's Protection":'has hundreds of whiskies',
  'Mackie Mayor':'is a food hall in a Victorian market building',
  'Manchester Art Gallery':'is free to get in',
  'The Whitworth':'is free to get in',
  'Science and Industry Museum':'is free to get in',
  "People's History Museum":'is free to get in',
  'John Rylands Library':'is a free neo-Gothic library',
  'John Rylands Research Institute and Library':'is a free neo-Gothic library',
  'IWM North':'is free to get in',
  'Imperial War Museum North':'is free to get in'
};
const CHAINS=/^(j ?d )?(wetherspoon|greene king|stonehouse|toby carvery|hungry horse|harvester|nando's|mcdonald's|kfc|burger king|greggs|subway|costa|starbucks|caff[eè] nero|pret|pizza hut|domino's|papa john's|wagamama|zizzi|ask italian|prezzo|frankie & benny's|bella italia|slug and lettuce|be at one|revolution|walkabout|yates|o'neill's|all bar one|browns|las iguanas|tgi fridays|five guys|leon|itsu|wasabi|gourmet burger kitchen|byron|bill's|cosy club|the botanist|brewdog|turtle bay|miller & carter|tim hortons|black sheep coffee|gail's|wingstop|popeyes|taco bell|pizza express|franco manca|honest burgers|dishoom)\b/i;

/* ---------- State ---------- */
let dial=(()=>{const n=parseInt(store.get('dial3'),10);return n>=0&&n<=2?n:1})();
let dist=(()=>{const n=parseInt(store.get('dist'),10);return n>=0&&n<=2?n:1})();
let when='now';
let F={mode:'idle'};
let slots={};
let timings=[];
let runId=0,runStart=0,runTotal=null;
let seed=1;
let libsPromise=null;
let permState='prompt';
let lastOpts={};
const test={postcode:'',at:''};

/* ---------- Words for time ---------- */
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const HOURW=['twelve','one','two','three','four','five','six','seven','eight','nine','ten','eleven'];
const pad=n=>String(n).padStart(2,'0');
const t24=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const hw=h=>HOURW[h%12];
const sameDay=(a,b)=>a.toDateString()===b.toDateString();
const dayStart=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const pick=(arr,r)=>arr[Math.floor(r()*arr.length)%arr.length];
const addMins=(d,m)=>new Date(d.getTime()+m*6e4);
const hourOf=d=>d.getHours()+d.getMinutes()/60;

function vague(d,rowdy){
  const h=d.getHours(),m=d.getMinutes();
  if(rowdy){
    if(h>=1&&h<5)return "stupid o'clock";
    if(h>=5&&h<7)return 'the crack of dawn';
    if(h>=12&&h<14)return 'dinnertime';
    if(h===17||(h===18&&m<30))return 'teatime';
  }
  if(m<20)return h===0?'gone midnight':h===12?'gone twelve':'gone '+hw(h);
  if(m<45)return 'half '+hw(h)+'-ish';
  const n=(h+1)%24;
  return n===0?'nearly midnight':'nearly '+hw(n);
}
/* Clock times for facts that matter (closing, start, rain). Exact at every setting, said differently. */
function clockSay(d,n,ref){
  if(!d)return '';
  let s;
  if(n===0)s=d.getHours()===0&&d.getMinutes()===0?'midnight':t24(d);
  else{
    const h=d.getHours(),m=d.getMinutes();
    if(m===0)s=h===0?'midnight':h===12?'midday':hw(h);
    else if(m===30)s='half '+hw(h);
    else if(m===15)s='quarter past '+hw(h);
    else if(m===45)s='quarter to '+hw((h+1)%24);
    else s=(h%12||12)+':'+pad(m)+(h<12?'am':'pm');
  }
  if(ref&&!sameDay(d,ref)){
    const days=Math.round((dayStart(d)-dayStart(ref))/864e5);
    if(!(days===1&&d.getHours()<6))s+=days===1?' tomorrow':' on '+DAYS[d.getDay()];
  }
  return s;
}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- Sun (after SunCalc, Vladimir Agafonkin) ---------- */
const RAD=Math.PI/180,J1970=2440588,J2000=2451545,OBL=RAD*23.4397;
const toDays=d=>d.valueOf()/864e5-0.5+J1970-J2000;
const fromJ=j=>new Date((j+0.5-J1970)*864e5);
function sunTimes(date,lat,lng){
  const lw=RAD*-lng,phi=RAD*lat,d=toDays(date);
  const n=Math.round(d-0.0009-lw/(2*Math.PI));
  const ds=0.0009+lw/(2*Math.PI)+n;
  const M=RAD*(357.5291+0.98560028*ds);
  const L=M+RAD*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M))+RAD*102.9372+Math.PI;
  const dec=Math.asin(Math.sin(OBL)*Math.sin(L));
  const Jnoon=J2000+ds+0.0053*Math.sin(M)-0.0069*Math.sin(2*L);
  const w=Math.acos((Math.sin(-0.833*RAD)-Math.sin(phi)*Math.sin(dec))/(Math.cos(phi)*Math.cos(dec)));
  if(isNaN(w))return null;
  const a=0.0009+(w+lw)/(2*Math.PI)+n;
  const Jset=J2000+a+0.0053*Math.sin(M)-0.0069*Math.sin(2*L);
  return{rise:fromJ(Jnoon-(Jset-Jnoon)),set:fromJ(Jset)};
}
const sunFor=d=>F.pos?sunTimes(new Date(d.getFullYear(),d.getMonth(),d.getDate(),12),F.pos.lat,F.pos.lon):null;

/* ---------- Distance ---------- */
function metres(a,b){
  const dLat=(b.lat-a.lat)*RAD,dLon=(b.lon-a.lon)*RAD;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*RAD)*Math.cos(b.lat*RAD)*Math.sin(dLon/2)**2;
  return 2*6371000*Math.asin(Math.sqrt(h));
}
const walkMins=m=>Math.max(1,Math.round(m*1.3/80));
const miles=m=>{const x=m/1609.34;return x<10?Math.round(x*10)/10:Math.round(x)};
const milesText=m=>{const x=miles(m);return x===1?'a mile':x+' miles'};
const yardsText=m=>Math.max(50,Math.round(m*1.0936/50)*50)+' yards';

/* ---------- Weather words ---------- */
const wetCode=c=>(c>=51&&c<=67)||(c>=80&&c<=82)||c>=95;
function condWord(c,day){
  if(c===0||c===1)return day?'sunny':'clear';
  if(c===2)return 'partly cloudy';
  if(c===3)return 'overcast';
  if(c<=48)return 'foggy';
  if(c<=57)return 'drizzling';
  if(c<=67)return 'raining';
  if(c<=77)return 'snowing';
  if(c<=82)return 'showery';
  if(c<=86)return 'snow showers';
  return 'thundery';
}

function withTimeout(p,ms){
  return new Promise((res,rej)=>{
    const t=setTimeout(()=>rej({timeout:true}),ms);
    p.then(v=>{clearTimeout(t);res(v)},e=>{clearTimeout(t);rej(e)});
  });
}
function timed(name,fn,ms){
  const rec={name,status:'pending',ms:null,note:''};
  timings.push(rec);renderTimings();
  const t0=performance.now();
  return withTimeout(Promise.resolve().then(fn),ms).then(v=>{
    rec.ms=performance.now()-t0;rec.status='ok';
    if(v&&v.host)rec.note=v.host;
    renderTimings();return v;
  },e=>{
    rec.ms=performance.now()-t0;rec.status=e&&e.timeout?'timeout':'failed';
    renderTimings();throw e;
  });
}
async function getJSON(url,ms=8000){
  const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),ms);
  try{
    const r=await fetch(url,{signal:ctrl.signal});
    if(!r.ok)throw new Error('HTTP '+r.status);

  }finally{clearTimeout(t)}
}
function loadScript(urls){
  return new Promise((res,rej)=>{
    const tryOne=i=>{
      if(i>=urls.length)return rej(new Error('script failed'));
      const s=document.createElement('script');
      s.src=urls[i];s.async=false;
      s.onload=()=>res();s.onerror=()=>{s.remove();tryOne(i+1)};
      document.head.appendChild(s);
    };
    tryOne(0);
  });
}

/* ---------- Gather ---------- */
function roleOf(t){
  const a=t.amenity,tour=t.tourism,s=t.shop,l=t.leisure;
  if(tour==='gallery'||tour==='museum'||a==='arts_centre')return 'culture';
  if(a==='pub'||a==='biergarten')return 'pub';
  if(a==='bar')return 'bar';
  if(a==='nightclub')return 'club';
  if(a==='cafe'||a==='ice_cream')return 'cafe';
  if(a==='restaurant'||a==='fast_food'||a==='food_court')return 'food';
  if(l==='park')return 'park';
  if(a==='karaoke_box'||(l&&new RegExp('^('+LEIS+')$').test(l)))return 'activity';
  if(s)return 'shop';
  if(a==='cinema'||a==='theatre'||a==='music_venue')return 'listing';
  return null;
}
const isTramStop=t=>t.railway==='tram_stop'||(t.railway==='station'&&(t.station==='light_rail'||t.tram==='yes'||/metrolink/i.test(t.network||'')));
/* Quality signals the map knows. Each is a verb phrase that follows "it". */
function traitsOf(p){
  const t=p.t,r=[];
  if(t.microbrewery==='yes')r.push({k:'ale',vp:'brews its own beer'});
  else if(t.real_ale==='yes'||t['drink:real_ale']==='yes')r.push({k:'ale',vp:'does real ale'});
  if(t.heritage||t.listed_status||t['heritage:operator'])r.push({k:'heritage',vp:'is in a listed building'});
  else if(t.wikipedia&&p.role!=='culture')r.push({k:'heritage',vp:'is notable enough for Wikipedia'});
  if(p.role==='culture'&&t.fee==='no')r.push({k:'free',vp:'is free to get in'});
  if(t.beer_garden==='yes'||t.amenity==='biergarten')r.push({k:'outdoor',vp:'has a beer garden'});
  else if(t.outdoor_seating==='yes')r.push({k:'outdoor',vp:'has seats outside'});
  return r;
}
function makePlaces(els,zone,OH,country,hubs){
  const out=[],stops=[];
  for(const e of els||[]){
    const t=e.tags||{};
    const lat=e.lat??(e.center&&e.center.lat),lon=e.lon??(e.center&&e.center.lon);
    if(lat==null||lon==null||!t.name)continue;
    if(isTramStop(t)){stops.push({name:t.name,key:norm(t.name),lat,lon});continue}
    if(t.railway)continue;
    const role=roleOf(t);
    if(!role)continue;
    const p={name:t.name,role,zone,lat,lon,t,kind:t.amenity||t.tourism||t.leisure||t.shop,cuisine:(t.cuisine||'').split(';')[0].trim(),
      raw:t.opening_hours||'',oh:null,town:t['addr:town']||t['addr:city']||t['addr:village']||null};
    if(zone==='hub'){
      let hb=null,hd=1e9;
      for(const h of hubs){const d=metres(h,p);if(d<hd){hd=d;hb=h}}
      if(!hb||hd>hb.r+150)continue;
      p.hub=hb.key;
    }
    if(p.raw&&OH){
      try{p.oh=new OH(p.raw,{lat,lon,address:{country_code:'gb',state:country||'England'}},{tag_key:'opening_hours',locale:'en'})}
      catch(err){p.bad=true}
    }
    p.dist=F.pos?metres(F.pos,p):0;
    p.walk=walkMins(p.dist);
    p.chain=!!(t.brand||t['brand:wikidata'])||CHAINS.test(p.name);
    p.pick=PICKS[p.name]||null;
    p.traits=traitsOf(p);
    out.push(p);
  }
  return{places:out,stops};
}
function mergePlaces(lists){
  const seen=new Set(),out=[];
  for(const p of lists.flat()){
    const k=p.name.toLowerCase()+'|'+p.role+'|'+(p.hub||p.zone);
    if(seen.has(k))continue;
    seen.add(k);out.push(p);
  }
  return out.sort((a,b)=>a.dist-b.dist);
}
function mergeStops(lists){
  const by=new Map();
  for(const s of lists.flat())if(!by.has(s.key))by.set(s.key,s);
  const out=[...by.values()];
  for(const s of out){s.dist=F.pos?metres(F.pos,s):0;s.walk=walkMins(s.dist)}
  return out.sort((a,b)=>a.dist-b.dist);
}
function isOpen(p,d){try{return !!p.oh&&!p.oh.getUnknown(d)&&p.oh.getState(d)}catch(e){return false}}
function nextChange(p,d){try{return p.oh.getNextChange(d)||null}catch(e){return null}}

/* ---------- Weather ---------- */
function hourIndex(d){
  const W=F.wxRaw;if(!W)return -1;
  const off=(W.utc_offset_seconds||0)*1000;
  if(!W._T)W._T=W.hourly.time.map(s=>Date.parse(s+':00Z')-off);
  let i=-1;
  for(let k=0;k<W._T.length;k++){if(W._T[k]<=d.getTime())i=k;else break}
  return i>=0&&d.getTime()-W._T[i]<=2*3600e3?i:-1;
}
function wxAt(d){
  const W=F.wxRaw,i=hourIndex(d);if(i<0)return null;
  const H=W.hourly;
  return{temp:H.temperature_2m[i],feels:H.apparent_temperature[i],code:H.weather_code[i],
    wet:wetCode(H.weather_code[i])||(H.precipitation[i]||0)>=.3||(H.precipitation_probability[i]||0)>=70};
}
/* Good enough to sit outside: dry, feels 13°C or more, and light */
function niceOut(d){
  const w=wxAt(d);if(!w)return false;
  const sun=sunFor(d);
  return !w.wet&&w.feels>=13&&(!sun||(d>=sun.rise&&d<sun.set));
}
function weatherFor(start,end,live){
  const W=F.wxRaw;if(!W)return null;
  const H=W.hourly,i=hourIndex(start);
  if(i<0)return null;
  let temp=H.temperature_2m[i],feels=H.apparent_temperature[i],code=H.weather_code[i],isDay=!!H.is_day[i],precip=H.precipitation[i]||0;
  if(live&&W.current){const c=W.current;temp=c.temperature_2m??temp;feels=c.apparent_temperature??feels;code=c.weather_code??code;isDay=c.is_day!=null?!!c.is_day:isDay;precip=c.precipitation??precip}
  const j=Math.max(i,hourIndex(end));
  let minFeels=feels,rainAt=null;
  for(let k=i+1;k<=j&&k<H.time.length;k++){
    minFeels=Math.min(minFeels,H.apparent_temperature[k]);
    if(!rainAt&&(H.precipitation_probability[k]||0)>=60&&wetCode(H.weather_code[k]))rainAt=new Date(W._T[k]);
  }
  const day=H.time[i].slice(0,10);
  let sunnyHrs=0;
  for(let k=0;k<i;k++){
    if(H.time[k].slice(0,10)!==day)continue;
    const hr=+H.time[k].slice(11,13);
    if(hr>=10&&hr<=17&&H.weather_code[k]<=1&&H.is_day[k])sunnyHrs++;
  }
  const D=W.daily||{time:[]},di=D.time.indexOf(day);
  return{temp,feels,code,isDay,minFeels,rainAt,sunnyHrs,
    rainNow:wetCode(code)||precip>=0.3,
    tomMax:D.temperature_2m_max?D.temperature_2m_max[di+1]:null,tomMin:D.temperature_2m_min?D.temperature_2m_min[di+1]:null};
}

/* ---------- Getting about ---------- */
function norm(s){
  return String(s).toLowerCase().replace(/[’‘'`]/g,'').replace(/&/g,' and ')
    .replace(/\b(metrolink|tram stop|stop|station|interchange)\b/g,' ').replace(/^\s*the\s+/,'').replace(/[^a-z0-9]+/g,' ').trim();
}
const NET=(()=>{
  const adj=new Map(),label=new Map();
  const add=k=>{if(!adj.has(k))adj.set(k,new Set())};
  for(const line of METROLINK)line.forEach((name,i)=>{
    const k=norm(name);add(k);label.set(k,name);
    if(i){const j=norm(line[i-1]);adj.get(k).add(j);adj.get(j).add(k)}
  });
  const depth=new Map(),root=norm("St Peter's Square"),q=[root];depth.set(root,0);
  while(q.length){const k=q.shift();for(const n of adj.get(k))if(!depth.has(n)){depth.set(n,depth.get(k)+1);q.push(n)}}
  return{adj,label,depth,city:new Set(CITY_STOPS.map(norm))};
})();
function tramPath(a,b){
  if(!NET.adj.has(a)||!NET.adj.has(b))return null;
  const prev=new Map([[a,null]]),q=[a];
  while(q.length){const k=q.shift();if(k===b)break;for(const n of NET.adj.get(k))if(!prev.has(n)){prev.set(n,k);q.push(n)}}
  if(!prev.has(b))return null;
  const path=[];for(let k=b;k!==null;k=prev.get(k))path.unshift(k);
  return path;
}
/* A ride between two stops. Every line runs into town, so a trip that goes in and back out again
   changes where it turns: at a junction (Cornbrook, Trafford Bar…) for certain, in town only maybe. */
const rideCache=new Map();
function ride(s1,s2){
  const ck=s1.key+'|'+s2.key;
  if(rideCache.has(ck))return rideCache.get(ck);
  let r;
  const path=tramPath(s1.key,s2.key);
  if(!path){r={mins:Math.round(2+metres(s1,s2)/1000*2.6),change:null}}
  else{
    let turn=path[0];
    for(const k of path)if(NET.depth.get(k)<NET.depth.get(turn))turn=k;
    let change=null;
    const ends=[path[0],path[path.length-1]];
    if(!ends.includes(turn)){
      if(!NET.city.has(turn))change=NET.label.get(turn);
      else if(!(NET.city.has(ends[0])&&NET.city.has(ends[1])))change='town';
    }
    r={mins:Math.round((path.length-1)*TRAM.hop+1),change,stops:path.length-1};
  }
  rideCache.set(ck,r);
  return r;
}
const tramRunning=d=>hourOf(d)>=TRAM.first&&hourOf(d)<TRAM.last;    // first trams about 6am, last about midnight
function stopsNear(pt,max){
  return (F.stops||[]).map(s=>({s,w:walkMins(metres(pt,s))})).filter(x=>x.w<=max).sort((a,b)=>a.w-b.w).slice(0,3);
}
function tramLeg(a,b,t,maxA,maxB){
  let best=null;
  for(const x of stopsNear(a,maxA))for(const y of stopsNear(b,maxB)){
    if(x.s.key===y.s.key)continue;
    const r=ride(x.s,y.s);
    const mins=x.w+TRAM.wait+r.mins+(r.change?TRAM.change:0)+y.w;
    if(!best||mins<best.mins)best={mode:'tram',mins,w1:x.w,from:x.s,to:y.s,ride:r.mins,change:r.change,w2:y.w};
  }
  if(best){best.leave=addMins(t,best.w1);best.running=tramRunning(best.leave)}
  return best;
}
function taxiLeg(a,b){
  const km=metres(a,b)/1000*TAXI.road;
  return{mode:'taxi',mins:Math.max(5,Math.round(TAXI.pickup+km/TAXI.kmh*60)),cost:Math.max(6,Math.round((TAXI.flag+km*TAXI.perKm)/5)*5)};
}
/* Tram if it's running and not much slower than a taxi; otherwise a taxi, with the tram (or the walk) as the other option */
function transport(a,b,t,prof,homeEnd){
  const taxi=taxiLeg(a,b);
  const tram=tramLeg(a,b,t,homeEnd==='a'?30:15,homeEnd==='b'?30:15);
  const w=walkMins(metres(a,b));
  if(tram&&tram.running&&tram.mins<=taxi.mins+prof.taxiSlack)return Object.assign(tram,{alt:taxi});
  return Object.assign(taxi,{alt:tram&&tram.running?tram:null,walk:w<=45?w:null,tramGone:!!(tram&&!tram.running)});
}

/* ---------- Plan ---------- */
function startFor(w,prof,now){
  if(w==='now')return now;
  if(w==='soon'){
    const d=new Date(now);
    if(now.getHours()<16)d.setHours(17,30,0,0);
    else{d.setTime(now.getTime()+90*6e4);d.setMinutes(Math.ceil(d.getMinutes()/15)*15,0,0)}
    return d;
  }
  const d=new Date(now);d.setDate(d.getDate()+1);
  const h=prof.tomorrow[d.getDay()===0||d.getDay()===6?1:0];
  d.setHours(Math.floor(h),Math.round((h%1)*60),0,0);
  return d;
}
function openAt(p,d){
  if(p.role==='park'){
    const sun=sunFor(d);
    if(!sun||d<sun.rise||d>addMins(sun.set,-30))return false;
    const w=wxAt(d);if(w&&w.wet)return false;
    return p.oh?isOpen(p,d):true;
  }
  return isOpen(p,d);
}
function closesAt(p,d){
  if(p.role==='park'){const sun=sunFor(d);return sun?sun.set:null}
  return nextChange(p,d);
}
function quality(p,prof,arrive){
  const Q=prof.q;let s=0;
  if(p.chain)s+=Q.chain;else if(/^(pub|bar|cafe|food)$/.test(p.role))s+=Q.indie;
  for(const tr of p.traits)s+=tr.k==='outdoor'?(niceOut(arrive)?Q.outdoor:0):(Q[tr.k]||0);
  if(p.pick)s+=Q.pick;
  return s;
}
function legCost(leg,ti,firstStep,p){
  if(!firstStep)return leg.mins*.5;
  if(ti===0)return leg.mins*.4;
  if(ti===1)return leg.mins*(leg.mode==='walk'?.08:.15);
  return leg.mins*.08;
}
/* One plan at one distance. hub: a destination for Further afield. beyond: Nearby's first stop must be past the doorstep. */
function buildPlan(prof,start,rand,ti,hub,beyond,notFirst){
  const D=DIST[ti],home={lat:F.pos.lat,lon:F.pos.lon};
  const end=new Date(dayStart(start).getTime()+prof.endHour*3600e3);
  const pool=(F.places||[]).filter(p=>(p.oh||p.role==='park')&&!(prof.avoid&&prof.avoid(p))&&(hub?p.hub===hub.key:p.zone==='local'));
  if(!pool.length)return null;
  const specs=prof.steps(start).slice();
  const foodAfter=prof.foodAfter?new Date(dayStart(start).getTime()+prof.foodAfter*3600e3):null;
  let t=start,from=home,extra=0;
  const steps=[],used=new Set();
  for(let i=0;i<specs.length;i++){
    /* The mad one keeps going until late before it eats */
    if(foodAfter&&specs[i][0]==='food'&&start<foodAfter&&t<addMins(foodAfter,-30)&&extra<1&&steps.length<prof.max-1){specs.splice(i,0,['club','bar','pub']);extra++}
    const roles=specs[i].filter(r=>r!=='-'),optional=specs[i].includes('-'),firstStep=!steps.length;
    let best=null,n=0,closings=[];
    for(const p of pool){
      const ri=roles.indexOf(p.role);
      if(ri<0)continue;
      if(ti===0&&p.walk>D.home)continue;
      if(firstStep&&beyond&&p.walk<beyond)continue;
      if(firstStep&&notFirst&&notFirst.has(p.name))continue;
      let leg;
      if(firstStep){
        if(hub)leg=transport(home,p,t,prof,'a');
        else if(p.walk<=D.first)leg={mode:'walk',mins:p.walk,m:p.dist};
        else if(D.ride&&p.dist<=RING_M+300)leg=transport(home,p,t,prof,'a');
      }else{
        const m=metres(from,p),w=walkMins(m);
        if(w<=D.hop)leg={mode:'walk',mins:w,m,homeward:ti===1&&p.walk<=10&&from.walk>12};
        /* Nearby: when there's nothing more out there, head back towards home */
        else if(ti===1&&p.walk<=10&&from.walk>12&&/^(pub|bar|food)$/.test(p.role))leg=w<=25?{mode:'walk',mins:w,m,homeward:true}:Object.assign(transport(from,p,t,prof,'b'),{homeward:true,m});

      if(!leg)continue;
      const arrive=addMins(t,leg.mins);
      if(arrive>end||!openAt(p,arrive))continue;
      if(p.role==='cafe'&&arrive.getHours()>=19)continue;
      const closes=closesAt(p,arrive);
      const left=closes?(closes-arrive)/6e4:1e4;
      if(left<(prof.strict?Math.max(MINSTAY[p.role],prof.stay[p.role]*.8):MINSTAY[p.role]))continue;

/* Further afield: try each destination, keep the best plan */

/* Try the chosen distance first, then further. If nothing works today, tomorrow. */

  const tryAt=s=>{
    for(let d=dist;d<DIST.length;d++){const r=planTier(prof,s,key,d);if(r)return Object.assign(r,{tier:d})}

    return `To get back to ${place}, walk ${B.w1} minutes to ${B.from.name} for the tram to ${B.to.name} – about ${B.ride} minutes${changeText(B)} – then it's ${B.w2} minutes' walk.${late}`;
  }
  if(B.tramGone)return `The trams will have stopped by then, so it's a taxi back to ${place} – about ${B.mins} minutes, around £${B.cost}.`;
  return `A taxi back to ${place} is about ${B.mins} minutes, around £${B.cost}`+(B.alt?', '+tramAlt(B.alt):B.walk?`, or ${minsText(B.walk)} on foot`:'')+'.';
}
function planSentences(P){
  const S=P.steps.map((s,i)=>i===0?firstSentence(s,P):nextSentence(s,P.steps[i-1],i,P.steps.length,P));
  S.push(backSentence(P));
  if(P.nightcap&&placeWord()){
    const c=P.nightcap;
    S.push(`Back in ${placeWord()}, ${c.p.name} is open till ${c.closes?clock(c.closes,P.home):'late'} if you want one more.`);
  }
  return S;
}
function weatherSentence(v){
  const ctx=F.plan||{start:F.at,rolled:null,wx:weatherFor(F.at,addMins(F.at,120),F.live)};
  const w=ctx.wx;if(!w)return null;
  if(!F.plan){v.temp=Math.round(w.temp);v.minFeels=Math.round(w.minFeels);v.rainAt=clock(w.rainAt,F.at)}
  /* If a stop has seats outside and it's nice, that's the weather line */
  const out=F.plan&&F.plan.steps&&F.plan.steps.find(s=>s.p.traits.some(t=>t.k==='outdoor')&&niceOut(s.arrive));
  if(out&&!w.rainAt){const x=wxAt(out.arrive);return `It'll be ${Math.round(x.temp)}°C and dry, so sit outside at ${out.p.name}.`}
  const s=ctx.start,sun=sunFor(s),dark=sun?(s>=sun.set||s<sun.rise):!w.isDay;
  let k='any';
  if(w.rainNow)k='rainNow';
  else if(w.rainAt)k='rainLater';
  else if(w.minFeels<7)k='cold';
  else if(!dark&&w.code<=1&&w.temp>=17)k='sunny';
  else if(when==='now'&&!ctx.rolled&&dark&&w.sunnyHrs>=2)k='sunnyEarlier';
  else if(w.feels>=12)k='mild';
  return say(WEATHER[k],v);
}
function signLine(v){
  const p=F.plan,h=p.start.getHours();
  let k='evening';
  if(when==='tomorrow'||p.rolled)k='tomorrow';
  else if(h<6)k='small';
  else if(h<16)k='day';
  return say(SIGN[k],v);
}

/* ---------- Render ---------- */
function linesWanted(){
  const n=dial,want=[];
  if(F.mode==='start'||F.mode==='denied'||F.mode==='badPostcode'){
    const set=F.mode==='denied'?DENIED:F.mode==='badPostcode'?FAILED.badPostcode:START;
    want.push({k:'ask',text:set[n][0]});
    return want;
  }
  if(F.mode!=='run')return want;
  if(slots.when==='loading'){want.push({k:'when',text:LOADING.when[n][0],cls:'loading'});return want}
  if(slots.plan==='ready'&&!F.plan)makePlan();
  R=rng((F.plan?F.plan.key:seed)+1);
  const v=baseVars();
  const vOpen=Object.assign({},v);
  let openSet;
  if(when==='now'){
    openSet=F.tb==='small'?OPEN.now.small:F.isFri&&(F.tb==='teatime'||F.tb==='evening')?OPEN.now.friday:OPEN.now.any;
  }else{
    openSet=OPEN[when];
    const s=startFor(when,PROFILES[dial],F.at),h=s.getHours();
    vOpen.start=clock(s,null);vOpen.weekday=DAYS[s.getDay()];vOpen.date=s.getDate()+' '+MONTHS[s.getMonth()];
    vOpen.part=h<5?'later tonight':h<12?'this morning':h<17?'this afternoon':'this evening';
  }
  want.push({k:'when',text:fill(pick(openSet[n],R),vOpen)});
  if(F.inGM===false)want.push({k:'outside',text:say(OUTSIDE,v)});
  const wxReady=slots.weather==='ready';
  if(slots.plan==='loading'||slots.plan==='away'||slots.plan==='remote'){
    want.push({k:'plan',text:LOADING[slots.plan==='loading'?'plan':slots.plan][n][0],cls:'loading'});
  }else if(slots.plan==='failed'){
    want.push({k:'plan',text:FAILED.plan[n][0],cls:'failed'});
    if(wxReady){const w=weatherSentence(v);if(w)want.push({k:'weather',text:w})}
  }else if(slots.plan==='ready'){
    const P=F.plan;
    if(F.remote)want.push({k:'plan',text:say(F.nearest?NOPLAN.remote:NOPLAN.remoteNone,v)});
    else if(P.steps){
      const lead=P.rolled?say(P.allShut?ROLL.allShut:ROLL.nothing,v):P.widened?say(WIDER[P.widened],v):P.tier===1&&!P.beyond?say(STAYLOCAL,v):null;
      const S=planSentences(P);
      if(lead)S[0]=lead+' '+S[0];
      /* The plan breathes in short paragraphs: getting there and the first stop, the rest, the way back */
      const back=S.splice(S.length-(P.nightcap&&placeWord()?2:1));
      want.push({k:'plan',text:S.slice(0,1).join(' ')});
      if(S.length>1)want.push({k:'plan2',text:S.slice(1).join(' ')});
      let tailText=back.join(' ');
      if(wxReady){const w=weatherSentence(v);if(w)tailText+=(tailText?' ':'')+w}
      if(tailText)want.push({k:'back',text:tailText});
    }else{
      let para=P.nLocal>=3&&P.nKnown<3?say(NOPLAN.unknown,v):say(NOPLAN.nothing,v);
      if(wxReady){const w=weatherSentence(v);if(w)para+=' '+w}
      want.push({k:'plan',text:para});
    }
    if(F.remote&&wxReady){const w=weatherSentence(v);if(w)want.push({k:'weather',text:w})}
  }
  if(slots.weather==='loading')want.push({k:'weather',text:LOADING.weather[n][0],cls:'loading'});
  else if(slots.weather==='failed')want.push({k:'weather',text:FAILED.weather[n][0],cls:'failed'});
  if(slots.plan==='ready'&&slots.weather!=='loading'){
    const P=F.plan;
    const sign=F.remote?say(NOPLAN.remoteSign,v):P.steps?signLine(v):null;
    if(sign)want.push({k:'sign',text:sign});
  }
  return want;
}
function render(){
  document.body.dataset.dial=dial;
  $('#dialName').textContent=PROFILES[dial].name;
  $('#dial').value=dial;
  $('#dial').setAttribute('aria-valuetext',PROFILES[dial].name);
  $('#distName').textContent=DIST[dist].name;
  $('#dist').value=dist;
  $('#dist').setAttribute('aria-valuetext',DIST[dist].name);
  document.querySelectorAll('[data-when]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.when===when)));
  const want=linesWanted();
  const box=$('#lines');
  const have=new Map([...box.children].map(el=>[el.dataset.k,el]));
  let prev=null;
  for(const L of want){
    let el=have.get(L.k);
    if(el)have.delete(L.k);
    else{el=document.createElement('p');el.dataset.k=L.k;el.classList.add('in')}
    const wasLoading=el.classList.contains('loading');
    if(el.textContent!==L.text)el.textContent=L.text;
    el.classList.toggle('loading',L.cls==='loading');
    el.classList.toggle('failed',L.cls==='failed');
    if(wasLoading&&L.cls!=='loading'){el.classList.remove('in');void el.offsetWidth;el.classList.add('in')}
    if(prev)prev.after(el);else box.prepend(el);
    prev=el;
  }
  for(const el of have.values())el.remove();
  $('#ask').hidden=!(F.mode==='start'||F.mode==='denied'||F.mode==='badPostcode');
  renderReceipts();renderFacts();renderTimings();renderWorkings();
}
function legText(L){
  if(L.mode==='walk')return `walk ${L.mins} min`;
  if(L.mode==='taxi')return `taxi ~${L.mins} min ~£${L.cost}`+(L.tramGone?' (no trams)':'');
  return `walk ${L.w1} min to ${L.from.name}, tram to ${L.to.name} ~${L.ride} min${L.change?' (change '+(L.change==='town'?'in town?':'at '+L.change)+')':''}, walk ${L.w2} min`;
}
function renderReceipts(){
  const el=$('#receipts');
  const P=F.mode==='run'&&slots.plan==='ready'?F.plan:null;
  if(!P||!P.steps||F.remote){el.textContent='';return}
  el.textContent=`Plan, ${DIST[P.tier].name.toLowerCase()}${P.hub?' ('+P.hub.name+')':''}: `+P.steps.map(s=>
    `${legText(s.leg)} → ${t24(s.arrive)} ${s.p.name} (${s.p.kind.replace('_',' ')}${s.p.cuisine?', '+s.p.cuisine:''}), ${s.closes?'till '+t24(s.closes):'open all night'}`
  ).join(' · ')+` · back: ${legText(P.back)}, ${t24(P.home)}`+(P.nightcap?` · nightcap: ${P.nightcap.p.name}`:'');
}
function renderFacts(){
  const parts=[];
  if(F.mode==='run'){
    const at=F.at;
    parts.push(`${t24(at)} ${DAYS[at.getDay()].slice(0,3)} ${at.getDate()} ${MONTHS[at.getMonth()].slice(0,3)}`);
    if(F.placeName||F.postcode)parts.push([F.placeName,F.postcode].filter(Boolean).join(', '));
    const w=F.wxRaw?weatherFor(at,at,F.live):null;
    if(w){
      parts.push(`Now ${Math.round(w.temp)}°C, feels ${Math.round(w.feels)}°C, ${condWord(w.code,w.isDay)}`);
      if(w.tomMax!=null)parts.push(`Tomorrow ${Math.round(w.tomMax)}° / ${Math.round(w.tomMin)}°`);
    }
    const sun=F.pos?sunFor(at):null;
    if(sun)parts.push((at>sun.set?'Sunset was ':'Sunset ')+t24(sun.set));
    if(F.stops&&F.stops.length&&F.stops[0].walk<=40)parts.push(`Nearest tram stop ${F.stops[0].name}, ${F.stops[0].walk} min walk`);
    if(test.at||test.postcode)parts.push('Test run');
  }
  parts.push('Decentish '+VERSION);
  $('#facts').textContent=parts.join(' · ');
}
function renderTimings(){
  const el=$('#timings');
  if(!timings.length){el.textContent='';return}
  const bits=timings.map(t=>{
    const r=t.status==='pending'?'…':t.status==='ok'?(t.ms/1000).toFixed(2)+'s':t.status==='timeout'?'timed out':'failed';
    return `${t.name} ${r}${t.note?' ('+t.note+')':''}`;
  });
  if(runTotal!=null)bits.push(`Total ${(runTotal/1000).toFixed(2)}s`);
  if(F.updated)bits.push('Updated '+t24(F.updated));
  el.textContent=bits.join(' · ');
}
function renderWorkings(){
  const box=$('#workings');
  if(box.hidden)return;
  box.textContent='';
  if(!F.places){box.textContent='Nothing loaded yet.';return}
  const P=F.plan;
  const head=document.createElement('p');
  const local=F.places.filter(p=>p.zone==='local');
  const hubs=(F.hubs||[]).map(h=>`${h.name} ${h.km.toFixed(1)} km, ${F.places.filter(p=>p.hub===h.key).length} places`).join('; ');
  head.textContent=`Profile: ${PROFILES[dial].name} · Distance: ${DIST[dist].name}${P&&P.widened?' (widened to '+DIST[P.widened].name+')':''} · When: ${when}${P&&P.rolled?' (rolled to tomorrow)':''} · Plan starts ${P?t24(P.start)+' '+DAYS[P.start.getDay()]:'–'} · In Greater Manchester: ${F.inGM===null?'unknown':F.inGM?'yes':'no'} · Here: ${local.length} places · Further afield: ${hubs||'none'}`;
  const stops=document.createElement('p');
  stops.textContent='Tram stops: '+((F.stops||[]).slice(0,6).map(s=>`${s.name} ${s.walk} min${NET.adj.has(s.key)?'':' (not on the network list)'}`).join(', ')||'none nearby');
  const ol=document.createElement('ol');
  const at=P?P.start:F.at;
  for(const p of local.slice(0,150)){
    const li=document.createElement('li');
    let st;
    if(p.role==='listing')st='needs listings, left out';
    else if(p.role==='park')st=openAt(p,at)?'light and dry':'dark or wet';
    else if(!p.oh)st=p.raw?'hours unclear: '+p.raw:'no hours on the map';
    else{const o=isOpen(p,at),nx=nextChange(p,at);st=o?'open'+(nx?' till '+clockSay(nx,0,at):', all hours'):'shut'+(nx?', opens '+clockSay(nx,0,at):'')}
    const notes=[p.chain?'chain':null,...p.traits.map(t=>t.k),p.pick?'pick':null].filter(Boolean).join(', ');
    li.textContent=`${p.walk} min · ${p.name} · ${p.role}${p.cuisine?' ('+p.cuisine+')':''}${notes?' · '+notes:''} · ${st}`;
    ol.append(li);
  }
  box.append(head,stops,ol);
}

/* ---------- Run ---------- */
function bucket(d){
  const m=d.getHours()*60+d.getMinutes();
  if(m<60)return 'late';if(m<300)return 'small';if(m<540)return 'early';if(m<720)return 'morning';
  if(m<990)return 'afternoon';if(m<1170)return 'teatime';if(m<1350)return 'evening';return 'late';
}
function pickHubs(pos){
  const list=HUBS.map(h=>Object.assign({},h,{km:metres(pos,h)/1000})).filter(h=>h.km>=HUB_KM[0]&&h.km<=HUB_KM[1]).sort((a,b)=>a.km-b.km);
  const town=list.find(h=>h.key==='town'),others=list.filter(h=>h.key!=='town').slice(0,town?2:3);
  return town?[town,...others]:others;
}
async function run(opts={}){
  const id=++runId;
  runStart=performance.now();runTotal=null;timings=[];seed=Math.floor(Math.random()*1e9);
  const live=!test.at;
  const at=test.at?new Date(test.at):new Date();
  F={mode:'run',at,live,tb:bucket(at),isFri:at.getDay()===5,inGM:null};
  slots={when:'loading'};
  render();
  if(!libsPromise)libsPromise=timed('Hours engine',loadLibs,20000).catch(()=>null);
  else timings.push({name:'Hours engine',status:'ok',ms:0,note:'already loaded'});
  const pc=test.postcode||opts.postcode||'';
  let pos,pcInfo=null;
  try{
    if(pc){pcInfo=await timed('Postcode',()=>lookupPostcode(pc),8000);pos={lat:pcInfo.lat,lon:pcInfo.lon}}
    else pos=await timed(permState==='granted'?'Location':'Location (incl. your tap)',getPosition,25000);
  }catch(e){
    if(id!==runId)return;
    F.mode=pc?'badPostcode':'denied';
    runTotal=performance.now()-runStart;render();return;
  }
  if(id!==runId)return;
  F.pos=pos;
  const q={lat:+pos.lat.toFixed(3),lon:+pos.lon.toFixed(3)};
  const pPost=pcInfo?Promise.resolve(pcInfo):timed('Postcode',()=>reversePostcode(q),8000).catch(()=>null);
  const pName=timed('Place name',()=>placeName(q),8000).catch(()=>null);
  const pWx=timed('Weather',()=>getJSON(weatherUrl(q),9000),10000).catch(()=>null);
  const pLocal=timed('Places',()=>overpass(localQuery(q)),40000).catch(()=>null);
  const pi=await pPost;
  if(id!==runId)return;
  F.postcode=pi&&pi.postcode;F.country=pi&&pi.country;
  F.inGM=pi?GM.includes(pi.district):null;
  F.hubs=F.inGM?pickHubs(pos):[];
  const pHubs=F.hubs.length?timed('Further afield',()=>overpass(hubQuery(F.hubs)),40000).catch(()=>null):Promise.resolve(null);
  const nm=await pName;
  if(id!==runId)return;
  F.placeName=nm||(pi&&(pi.ward||pi.district))||null;
  slots.when='ready';slots.plan='loading';slots.weather='loading';
  render();
  const wxDone=pWx.then(w=>{
    if(id!==runId)return;
    F.wxRaw=w&&w.hourly?w:null;
    slots.weather=F.wxRaw?'ready':'failed';
    F.plan=null;render();
  });
  const planDone=(async()=>{
    const[local,OH]=await Promise.all([pLocal,libsPromise]);
    if(id!==runId)return;
    if(!local){slots.plan='failed';render();return}
    if(F.hubs.length){slots.plan='away';render()}
    const away=await pHubs;
    if(id!==runId)return;
    const L=makePlaces(local.els,'local',OH,F.country,[]);
    const A=away?makePlaces(away.els,'hub',OH,F.country,F.hubs):{places:[],stops:[]};
    if(!away)F.hubs=[];
    F.places=mergePlaces([L.places,A.places]);
    F.stops=mergeStops([L.stops,A.stops]);
    const near=F.places.filter(p=>p.zone==='local'&&p.walk<=40&&!/^(listing|shop|park)$/.test(p.role));
    F.remote=!near.length&&!F.places.some(p=>p.zone==='hub');
    if(F.remote){
      slots.plan='remote';render();
      const wide=await timed('Wider search',()=>overpass(wideQuery(q)),30000).catch(()=>null);
      if(id!==runId)return;
      if(wide){
        const nn=makePlaces(wide.els,'far',OH,F.country,[]).places.sort((a,b)=>a.dist-b.dist)[0];
        if(nn){
          F.nearest=nn;
          let town=nn.town;
          if(!town)town=await timed('Nearest town',()=>placeName({lat:+nn.lat.toFixed(3),lon:+nn.lon.toFixed(3)},14),8000).catch(()=>null);
          F.nearestTown=town&&town!==F.placeName?town:null;
        }
      }
    }
    slots.plan='ready';F.plan=null;render();
  })();
  await Promise.all([wxDone,planDone]);
  if(id!==runId)return;
  runTotal=performance.now()-runStart;F.updated=new Date();
  render();
}
function replan(){if(F.mode==='run'){F.plan=null;render()}}

/* ---------- Controls ---------- */
$('#dial').addEventListener('input',e=>{dial=+e.target.value;store.set('dial3',dial);replan()});
$('#dist').addEventListener('input',e=>{dist=+e.target.value;store.set('dist',dist);replan()});
document.querySelectorAll('[data-when]').forEach(b=>b.addEventListener('click',()=>{when=b.dataset.when;replan()}));
/* Another plan: a fresh pick from the same data. After five minutes it fetches everything again. */
$('#refresh').addEventListener('click',()=>{
  if(F.mode==='start'||F.mode==='denied')return askLocation();
  if(F.mode==='run'&&runTotal!=null&&F.updated&&Date.now()-F.updated<5*60e3&&slots.plan==='ready'){seed=Math.floor(Math.random()*1e9);replan();return}
  run(lastOpts);
});
function askLocation(){lastOpts={};run(lastOpts)}
$('#useLocation').addEventListener('click',askLocation);
$('#askForm').addEventListener('submit',e=>{
  e.preventDefault();
  const pc=$('#askPostcode').value.trim();
  if(!pc){$('#askPostcode').focus();return}
  lastOpts={postcode:pc};run(lastOpts);
});
function toggle(btn,box){
  const open=box.hidden;box.hidden=!open;btn.setAttribute('aria-expanded',String(open));
  if(open&&box.id==='workings')renderWorkings();
}
$('#workingsToggle').addEventListener('click',e=>toggle(e.currentTarget,$('#workings')));
$('#labToggle').addEventListener('click',e=>toggle(e.currentTarget,$('#lab')));
const toLocalInput=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
function nextDay(dow,h,m){
  const now=new Date(),d=new Date(now);
  d.setDate(now.getDate()+((dow-now.getDay()+7)%7));d.setHours(h,m,0,0);
  if(d<now)d.setDate(d.getDate()+7);
  return d;
}
$('#labForm').addEventListener('submit',e=>{
  e.preventDefault();
  test.postcode=$('#tPostcode').value.trim();
  test.at=$('#tAt').value;
  run({});
});
$('#tClear').addEventListener('click',()=>{
  test.postcode='';test.at='';$('#tPostcode').value='';$('#tAt').value='';
  run(lastOpts);
});
document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{
  const p=b.dataset.preset;
  if(p==='fri')$('#tAt').value=toLocalInput(nextDay(5,17,30));
  if(p==='sat')$('#tAt').value=toLocalInput(nextDay(6,23,0));
  if(p==='sun')$('#tAt').value=toLocalInput(nextDay(0,10,0));
  if(p==='small'){const d=new Date();if(d.getHours()>=3)d.setDate(d.getDate()+1);d.setHours(3,0,0,0);$('#tAt').value=toLocalInput(d)}
  if(p==='nq')$('#tPostcode').value='M4 1HN';
  if(p==='remote')$('#tPostcode').value='HS9';
  $('#labForm').requestSubmit();
}));

/* ---------- Start ---------- */
async function boot(){
  render();
  try{
    const p=await navigator.permissions.query({name:'geolocation'});
    permState=p.state;
  }catch(e){}
  if(permState==='granted')run({});
  else{F={mode:'start'};render()}
}
boot();
})();
</script>
