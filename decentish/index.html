<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Decentish</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@700&display=swap">
<style>
/* Decentish 0.3. One face, one weight. The dial only changes colour: white, amber, red.
   The plan sits top left. Controls and the sober receipts sit at the foot, and the receipts never change colour. */
@font-face{font-family:"Diatype Bold";src:local("ABC Diatype Bold"),local("ABCDiatype-Bold"),url("ABCDiatype-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
:root{
  --face:"Diatype Bold","Hanken Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  --paper:#ffffff;
  --ink:#121212;
  --sober-paper:#ffffff;
  --sober-ink:#121212;
  --sober-soft:#5d5b56;
  --gutter:clamp(16px,4.5vw,44px);
  --voice:clamp(28px,5.6vw,64px);
  color-scheme:light;
}
body[data-dial="0"]{--paper:#ffffff}
body[data-dial="1"]{--paper:#f3b419}
body[data-dial="2"]{--paper:#ff4a2e}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--face);font-weight:700;letter-spacing:-.022em;-webkit-font-smoothing:antialiased;transition:background-color .6s ease}
.page{min-height:100%;display:flex;flex-direction:column}
.voice{flex:1;padding-inline:var(--gutter);padding-block:calc(var(--gutter) + env(safe-area-inset-top,0px)) var(--gutter)}
#lines p{margin:0 0 .3em;font-size:var(--voice);line-height:1.04;max-width:16em;overflow-wrap:break-word}
#lines p.in{animation:land .5s ease both}
#lines p.loading{animation:breathe 1.4s ease-in-out infinite}
@keyframes land{from{opacity:0;transform:translateY(.22em)}to{opacity:1;transform:none}}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:.22}}
.ask{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:1.1em;font-size:18px}
.ask form{display:flex;flex-wrap:wrap;gap:8px}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
.btn{background:transparent;border:2px solid currentColor;padding:9px 14px;cursor:pointer;border-radius:0}
.btn:hover,.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.field{background:transparent;border:2px solid currentColor;padding:9px 12px;border-radius:0;width:9.5em;min-width:0}
.field::placeholder{color:currentColor;opacity:.45}
:focus-visible{outline:3px solid currentColor;outline-offset:3px}
.desk{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 22px;padding-inline:var(--gutter);padding-block:10px 18px;font-size:14px}
.when{display:flex}
.when .btn{font-size:16px}
.when .btn+.btn{border-left-width:0}
.dial{flex:1 1 200px;min-width:0}
.dial label{display:block;font-size:18px;margin-bottom:8px}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:30px;margin:0;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;margin-top:-11px;background:var(--ink);border:0;border-radius:0}
input[type=range]::-moz-range-track{height:2px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;background:var(--ink);border:0;border-radius:0}
.ends{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin-top:2px}
.facts{background:var(--sober-paper);color:var(--sober-ink);border-top:2px solid var(--sober-ink);padding-inline:var(--gutter);padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));font-size:13px;line-height:1.45;font-variant-numeric:tabular-nums;display:grid;gap:6px}
.facts p{margin:0}
.soft{color:var(--sober-soft)}
.tools{display:flex;flex-wrap:wrap;gap:6px 18px}
.link{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lab{display:grid;gap:10px;padding-top:6px}
.lab form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lab .field{width:auto;padding:7px 10px;border-width:1.5px}
.lab .btn{padding:7px 12px;border-width:1.5px}
.lab .btn:hover{background:var(--sober-ink);color:var(--sober-paper)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.workings{display:grid;gap:4px;padding-top:6px}
.workings ol{margin:0;padding-left:1.4em;display:grid;gap:2px}
@media (prefers-reduced-motion:reduce){#lines p.in,#lines p.loading{animation:none}body{transition:none}}
</style>
</head>
<body data-dial="1">
<div class="page">
  <main class="voice">
    <div id="lines" aria-live="polite"></div>
    <div class="ask" id="ask" hidden>
      <button class="btn" id="useLocation" type="button">Use my location</button>
      <form id="askForm" autocomplete="off">
        <input class="field" id="askPostcode" name="postcode" placeholder="Postcode" aria-label="Postcode" autocapitalize="characters">
        <button class="btn" type="submit">Go</button>
      </form>
    </div>
  </main>
  <section class="desk" aria-label="Controls">
    <div class="when" role="group" aria-label="When">
      <button class="btn" type="button" data-when="now" aria-pressed="true">Now</button>
      <button class="btn" type="button" data-when="soon" aria-pressed="false">Soon</button>
      <button class="btn" type="button" data-when="tomorrow" aria-pressed="false">Tomorrow</button>
    </div>
    <div class="dial">
      <label for="dial" id="dialName">Three pints and a meal deal</label>
      <input type="range" id="dial" min="0" max="2" step="1" value="1">
      <div class="ends" aria-hidden="true"><span>Culture trip</span><span>Mad one</span></div>
    </div>
    <div class="dial">
      <label for="dist" id="distName">Walking distance</label>
      <input type="range" id="dist" min="0" max="2" step="1" value="1">
      <div class="ends" aria-hidden="true"><span>Doorstep</span><span>Further</span></div>
    </div>
    <button class="btn" id="refresh" type="button">Another plan</button>
  </section>
  <footer class="facts">
    <p id="receipts"></p>
    <p id="facts">Decentish 0.3</p>
    <p class="soft" id="timings"></p>
    <p class="soft">Not wired up yet: film times, gigs, trams, trains, ratings, hygiene. Cinemas and venues stay out of plans until their listings are in.</p>
    <div class="tools">
      <button class="link soft" id="workingsToggle" type="button" aria-expanded="false">Workings</button>
      <button class="link soft" id="labToggle" type="button" aria-expanded="false">Test</button>
    </div>
    <div class="workings" id="workings" hidden></div>
    <div class="lab" id="lab" hidden>
      <form id="labForm" autocomplete="off">
        <input class="field" id="tPostcode" placeholder="Postcode" aria-label="Test postcode" autocapitalize="characters">
        <input class="field" id="tAt" type="datetime-local" aria-label="Test day and time">
        <button class="btn" type="submit">Run test</button>
        <button class="btn" id="tClear" type="button">Back to real</button>
      </form>
      <div class="presets">
        <button class="btn" type="button" data-preset="fri">Friday 17:30</button>
        <button class="btn" type="button" data-preset="sat">Saturday 23:00</button>
        <button class="btn" type="button" data-preset="sun">Sunday 10:00</button>
        <button class="btn" type="button" data-preset="small">Tonight 03:00</button>
        <button class="btn" type="button" data-preset="nq">Northern Quarter, M4 1HN</button>
        <button class="btn" type="button" data-preset="remote">Barra, HS9</button>
      </div>
      <p class="soft">Test runs use real data for that place and time. Weather covers yesterday to a week ahead.</p>
    </div>
  </footer>
</div>
<script>
(()=>{
'use strict';
const VERSION='0.3';
const $=s=>document.querySelector(s);

/* ---------- Settings ---------- */
const SEARCH_M=1300;                          // local look: about a 20-minute walk
const WIDE_M=16000;                           // only when nothing is local
const TOWN={lat:53.4808,lon:-2.2369,r:1100};  // Manchester city centre, Piccadilly Gardens
const GM=['Bolton','Bury','Manchester','Oldham','Rochdale','Salford','Stockport','Tameside','Trafford','Wigan'];
const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter'];
const LIBS=[
  ['https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.min.js','https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js'],
  ['https://cdn.jsdelivr.net/npm/opening_hours@3.15.0/build/opening_hours.min.js','https://cdn.jsdelivr.net/npm/opening_hours@3.15.0/build/opening_hours.js']
];
const store={
  get(k){try{return localStorage.getItem('decentish:'+k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem('decentish:'+k,String(v))}catch(e){}}
};

/* ---------- The dial: three profiles ----------
   Each stop decides what gets picked, how late, how many steps, and how it talks. How far is the distance dial's job.
   Steps are lists of roles in order of preference. Stays are minutes spent at each kind of place.
   Tomorrow starts at [weekday, weekend] hours. */
const PROFILES=[
  {key:'blair',name:'Tony Blair on a culture trip',endHour:22.5,tomorrow:[18,11],
   avoid:p=>p.kind==='fast_food',strict:true,
   steps:s=>s.getHours()<16?[['culture'],['cafe','food'],['culture','cafe']]:s.getHours()>=21?[['bar','pub']]:[['food'],['bar','pub']],
   stay:{culture:75,cafe:40,food:75,pub:45,bar:45,club:60,shop:5},
   townBonus:(i,role)=>role==='culture'?6:1},
  {key:'pints',name:'Three pints and a meal deal',endHour:24.5,tomorrow:[17.5,13],
   steps:s=>s.getHours()>=5&&s.getHours()<11?[['cafe'],['pub','bar'],['food','shop']]:[['pub','bar'],['food','shop'],['pub','bar']],
   stay:{culture:45,cafe:30,food:45,pub:75,bar:60,club:60,shop:5},
   townBonus:()=>0},
  {key:'mad',name:'Pissed-up uncle on a mad one',endHour:30,tomorrow:[17.5,14],late:true,
   steps:s=>{const h=s.getHours();return h>=1&&h<6?[['club','bar','pub','food']]:[['pub','bar'],['bar','pub'],['bar','pub','club'],['club','bar'],['food']]},
   stay:{culture:20,cafe:15,food:20,pub:50,bar:50,club:120,shop:5},
   foodAfter:23,
   townBonus:(i,role,arrive)=>i>=1&&(arrive.getHours()>=19||arrive.getHours()<5)?10:0}
];
/* The distance dial: how far on foot, and whether a trip into town counts */
const DIST=[
  {name:'On the doorstep',walk:6,town:false},
  {name:'Walking distance',walk:15,town:false},
  {name:'Worth the trip',walk:25,town:true}
];
const MINSTAY={culture:45,cafe:20,food:30,pub:10,bar:10,club:30,shop:5};
const WHENS=['now','soon','tomorrow'];

/* ---------- State ---------- */
let dial=(()=>{const n=parseInt(store.get('dial3'),10);return n>=0&&n<=2?n:1})();
let dist=(()=>{const n=parseInt(store.get('dist'),10);return n>=0&&n<=2?n:1})();
let when='now';
let F={mode:'idle'};
let slots={};
let timings=[];
let runId=0,runStart=0,runTotal=null;
let seed=1;
let libsPromise=null;
let permState='prompt';
let lastOpts={};
const test={postcode:'',at:''};

/* ---------- Words for time ---------- */
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const HOURW=['twelve','one','two','three','four','five','six','seven','eight','nine','ten','eleven'];
const pad=n=>String(n).padStart(2,'0');
const t24=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const hw=h=>HOURW[h%12];
const sameDay=(a,b)=>a.toDateString()===b.toDateString();
const dayStart=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const pick=(arr,r)=>arr[Math.floor(r()*arr.length)%arr.length];

function vague(d,rowdy){
  const h=d.getHours(),m=d.getMinutes();
  if(rowdy){
    if(h>=1&&h<5)return "stupid o'clock";
    if(h>=5&&h<7)return 'the crack of dawn';
    if(h>=12&&h<14)return 'dinnertime';
    if(h===17||(h===18&&m<30))return 'teatime';
  }
  if(m<20)return h===0?'gone midnight':h===12?'gone twelve':'gone '+hw(h);
  if(m<45)return 'half '+hw(h)+'-ish';
  const n=(h+1)%24;
  return n===0?'nearly midnight':'nearly '+hw(n);
}
/* Clock times for facts that matter (closing, start, rain). Exact at every setting, said differently. */
function clockSay(d,n,ref){
  if(!d)return '';
  let s;
  if(n===0)s=d.getHours()===0&&d.getMinutes()===0?'midnight':t24(d);
  else{
    const h=d.getHours(),m=d.getMinutes();
    if(m===0)s=h===0?'midnight':h===12?'midday':hw(h);
    else if(m===30)s='half '+hw(h);
    else if(m===15)s='quarter past '+hw(h);
    else if(m===45)s='quarter to '+hw((h+1)%24);
    else s=(h%12||12)+':'+pad(m)+(h<12?'am':'pm');
  }
  if(ref&&!sameDay(d,ref)){
    const days=Math.round((dayStart(d)-dayStart(ref))/864e5);
    if(!(days===1&&d.getHours()<6))s+=days===1?' tomorrow':' on '+DAYS[d.getDay()];
  }
  return s;
}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- Sun (after SunCalc, Vladimir Agafonkin) ---------- */
const RAD=Math.PI/180,J1970=2440588,J2000=2451545,OBL=RAD*23.4397;
const toDays=d=>d.valueOf()/864e5-0.5+J1970-J2000;
const fromJ=j=>new Date((j+0.5-J1970)*864e5);
function sunTimes(date,lat,lng){
  const lw=RAD*-lng,phi=RAD*lat,d=toDays(date);
  const n=Math.round(d-0.0009-lw/(2*Math.PI));
  const ds=0.0009+lw/(2*Math.PI)+n;
  const M=RAD*(357.5291+0.98560028*ds);
  const L=M+RAD*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M))+RAD*102.9372+Math.PI;
  const dec=Math.asin(Math.sin(OBL)*Math.sin(L));
  const Jnoon=J2000+ds+0.0053*Math.sin(M)-0.0069*Math.sin(2*L);
  const w=Math.acos((Math.sin(-0.833*RAD)-Math.sin(phi)*Math.sin(dec))/(Math.cos(phi)*Math.cos(dec)));
  if(isNaN(w))return null;
  const a=0.0009+(w+lw)/(2*Math.PI)+n;
  const Jset=J2000+a+0.0053*Math.sin(M)-0.0069*Math.sin(2*L);
  return{rise:fromJ(Jnoon-(Jset-Jnoon)),set:fromJ(Jset)};
}
const sunFor=d=>F.pos?sunTimes(new Date(d.getFullYear(),d.getMonth(),d.getDate(),12),F.pos.lat,F.pos.lon):null;

/* ---------- Distance ---------- */
function metres(a,b){
  const dLat=(b.lat-a.lat)*RAD,dLon=(b.lon-a.lon)*RAD;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*RAD)*Math.cos(b.lat*RAD)*Math.sin(dLon/2)**2;
  return 2*6371000*Math.asin(Math.sqrt(h));
}
const walkMins=m=>Math.max(1,Math.round(m*1.3/80));
const miles=m=>{const x=m/1609.34;return x<10?Math.round(x*10)/10:Math.round(x)};

/* ---------- Weather words ---------- */
const wetCode=c=>(c>=51&&c<=67)||(c>=80&&c<=82)||c>=95;
function condWord(c,day){
  if(c===0||c===1)return day?'sunny':'clear';
  if(c===2)return 'partly cloudy';
  if(c===3)return 'overcast';
  if(c<=48)return 'foggy';
  if(c<=57)return 'drizzling';
  if(c<=67)return 'raining';
  if(c<=77)return 'snowing';
  if(c<=82)return 'showery';
  if(c<=86)return 'snow showers';
  return 'thundery';
}

/* ---------- Sources ---------- */
function withTimeout(p,ms){
  return new Promise((res,rej)=>{
    const t=setTimeout(()=>rej({timeout:true}),ms);
    p.then(v=>{clearTimeout(t);res(v)},e=>{clearTimeout(t);rej(e)});
  });
}
function timed(name,fn,ms){
  const rec={name,status:'pending',ms:null,note:''};
  timings.push(rec);renderTimings();
  const t0=performance.now();
  return withTimeout(Promise.resolve().then(fn),ms).then(v=>{
    rec.ms=performance.now()-t0;rec.status='ok';
    if(v&&v.host)rec.note=v.host;
    renderTimings();return v;
  },e=>{
    rec.ms=performance.now()-t0;rec.status=e&&e.timeout?'timeout':'failed';
    renderTimings();throw e;
  });
}
async function getJSON(url,ms=8000){
  const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),ms);
  try{
    const r=await fetch(url,{signal:ctrl.signal});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.json();
  }finally{clearTimeout(t)}
}
function loadScript(urls){
  return new Promise((res,rej)=>{
    const tryOne=i=>{
      if(i>=urls.length)return rej(new Error('script failed'));
      const s=document.createElement('script');
      s.src=urls[i];s.async=false;
      s.onload=()=>res();s.onerror=()=>{s.remove();tryOne(i+1)};
      document.head.appendChild(s);
    };
    tryOne(0);
  });
}
async function loadLibs(){
  await loadScript(LIBS[0]);
  await loadScript(LIBS[1]);
  if(typeof window.opening_hours!=='function')throw new Error('hours engine missing');
  return window.opening_hours;
}
function getPosition(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation)return rej({code:'unsupported'});
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude,lon:p.coords.longitude}),
      e=>rej({code:e.code===1?'denied':'unavailable'}),
      {enableHighAccuracy:false,timeout:15000,maximumAge:300000}
    );
  });
}
const first=x=>Array.isArray(x)?x[0]:x;
async function lookupPostcode(pc){
  const clean=pc.trim().toUpperCase().replace(/\s+/g,' ');
  try{
    const j=await getJSON('https://api.postcodes.io/postcodes/'+encodeURIComponent(clean),6000);
    const r=j.result;
    return{lat:r.latitude,lon:r.longitude,postcode:r.postcode,ward:r.admin_ward,district:r.admin_district,country:r.country};
  }catch(e){
    const out=clean.split(' ')[0];
    const j=await getJSON('https://api.postcodes.io/outcodes/'+encodeURIComponent(out),6000);
    const r=j.result;
    return{lat:r.latitude,lon:r.longitude,postcode:r.outcode,ward:first(r.admin_ward),district:first(r.admin_district),country:first(r.country)};
  }
}
async function reversePostcode(q){
  const j=await getJSON(`https://api.postcodes.io/postcodes?lon=${q.lon}&lat=${q.lat}&radius=1000&limit=1`,6000);
  const r=j.result&&j.result[0];
  return r?{postcode:r.postcode,ward:r.admin_ward,district:r.admin_district,country:r.country}:null;
}
async function placeName(q,zoom=16){
  const j=await getJSON(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${q.lat}&lon=${q.lon}&zoom=${zoom}&addressdetails=1&accept-language=en-GB`,6000);
  const a=j.address||{};
  return a.suburb||a.village||a.hamlet||a.neighbourhood||a.quarter||a.town||a.city_district||a.city||null;
}
const weatherUrl=q=>`https://api.open-meteo.com/v1/forecast?latitude=${q.lat}&longitude=${q.lon}`+
  '&current=temperature_2m,apparent_temperature,weather_code,precipitation,is_day'+
  '&hourly=temperature_2m,apparent_temperature,weather_code,precipitation_probability,precipitation,is_day'+
  '&daily=temperature_2m_max,temperature_2m_min&timezone=auto&past_days=1&forecast_days=8';
const venueQuery=(lat,lon,r)=>`[out:json][timeout:20];(`+
  `nwr(around:${r},${lat},${lon})[amenity~"^(pub|bar|biergarten|nightclub|restaurant|fast_food|cafe|ice_cream|cinema|theatre|arts_centre|music_venue)$"][name];`+
  `nwr(around:${r},${lat},${lon})[tourism~"^(gallery|museum)$"][name];`+
  `nwr(around:${r},${lat},${lon})[shop~"^(convenience|alcohol)$"][name];`+
  `);out center tags;`;
const wideQuery=q=>`[out:json][timeout:20];(`+
  `nwr(around:${WIDE_M},${q.lat},${q.lon})[amenity~"^(pub|bar|restaurant|cafe|fast_food)$"][name];`+
  `);out center tags;`;
async function overpass(query){
  let last;
  for(const url of OVERPASS){
    const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),12000);
    try{
      const r=await fetch(url,{method:'POST',body:'data='+encodeURIComponent(query),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ctrl.signal});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json();
      return{els:j.elements||[],host:new URL(url).hostname};
    }catch(e){last=e}finally{clearTimeout(t)}
  }
  throw last;
}

/* ---------- Gather ---------- */
function roleOf(t){
  const a=t.amenity,tour=t.tourism,s=t.shop;
  if(tour==='gallery'||tour==='museum'||a==='arts_centre')return 'culture';
  if(a==='pub'||a==='biergarten')return 'pub';
  if(a==='bar')return 'bar';
  if(a==='nightclub')return 'club';
  if(a==='cafe'||a==='ice_cream')return 'cafe';
  if(a==='restaurant'||a==='fast_food')return 'food';
  if(s)return 'shop';
  if(a==='cinema'||a==='theatre'||a==='music_venue')return 'listing';
  return null;
}
function makePlaces(els,zone,OH,country){
  const out=[];
  for(const e of els||[]){
    const t=e.tags||{},role=roleOf(t);
    if(!role||!t.name)continue;
    const lat=e.lat??(e.center&&e.center.lat),lon=e.lon??(e.center&&e.center.lon);
    if(lat==null||lon==null)continue;
    const p={name:t.name,role,zone,lat,lon,kind:t.amenity||t.tourism||t.shop,cuisine:(t.cuisine||'').split(';')[0].trim(),
      raw:t.opening_hours||'',oh:null,town:t['addr:town']||t['addr:city']||t['addr:village']||null};
    if(p.raw&&OH){
      try{p.oh=new OH(p.raw,{lat,lon,address:{country_code:'gb',state:country||'England'}},{tag_key:'opening_hours',locale:'en'})}
      catch(err){p.bad=true}
    }
    p.dist=F.pos?metres(F.pos,p):0;
    p.walk=walkMins(p.dist);
    out.push(p);
  }
  return out;
}
function mergePlaces(local,town){
  const seen=new Set(),out=[];
  for(const p of [...local,...town]){
    const k=p.name.toLowerCase()+'|'+p.role;
    if(seen.has(k))continue;
    seen.add(k);out.push(p);
  }
  return out.sort((a,b)=>a.dist-b.dist);
}
function isOpen(p,d){try{return !!p.oh&&!p.oh.getUnknown(d)&&p.oh.getState(d)}catch(e){return false}}
function nextChange(p,d){try{return p.oh.getNextChange(d)||null}catch(e){return null}}

/* ---------- Weather over a window ---------- */
function hourIndex(d){
  const W=F.wxRaw;if(!W)return -1;
  const off=(W.utc_offset_seconds||0)*1000;
  if(!W._T)W._T=W.hourly.time.map(s=>Date.parse(s+':00Z')-off);
  let i=-1;
  for(let k=0;k<W._T.length;k++){if(W._T[k]<=d.getTime())i=k;else break}
  return i>=0&&d.getTime()-W._T[i]<=2*3600e3?i:-1;
}
function weatherFor(start,end,live){
  const W=F.wxRaw;if(!W)return null;
  const H=W.hourly,i=hourIndex(start);
  if(i<0)return null;
  let temp=H.temperature_2m[i],feels=H.apparent_temperature[i],code=H.weather_code[i],isDay=!!H.is_day[i],precip=H.precipitation[i]||0;
  if(live&&W.current){const c=W.current;temp=c.temperature_2m??temp;feels=c.apparent_temperature??feels;code=c.weather_code??code;isDay=c.is_day!=null?!!c.is_day:isDay;precip=c.precipitation??precip}
  const j=Math.max(i,hourIndex(end));
  let minFeels=feels,rainAt=null;
  for(let k=i+1;k<=j&&k<H.time.length;k++){
    minFeels=Math.min(minFeels,H.apparent_temperature[k]);
    if(!rainAt&&(H.precipitation_probability[k]||0)>=60&&wetCode(H.weather_code[k]))rainAt=new Date(W._T[k]);
  }
  const day=H.time[i].slice(0,10);
  let sunnyHrs=0;
  for(let k=0;k<i;k++){
    if(H.time[k].slice(0,10)!==day)continue;
    const hr=+H.time[k].slice(11,13);
    if(hr>=10&&hr<=17&&H.weather_code[k]<=1&&H.is_day[k])sunnyHrs++;
  }
  const D=W.daily||{time:[]},di=D.time.indexOf(day);
  return{temp,feels,code,isDay,minFeels,rainAt,sunnyHrs,
    rainNow:wetCode(code)||precip>=0.3,
    tomMax:D.temperature_2m_max?D.temperature_2m_max[di+1]:null,tomMin:D.temperature_2m_min?D.temperature_2m_min[di+1]:null};
}

/* ---------- Plan ---------- */
function startFor(w,prof,now){
  if(w==='now')return now;
  if(w==='soon'){
    const d=new Date(now);
    if(now.getHours()<16)d.setHours(17,30,0,0);
    else{d.setTime(now.getTime()+90*6e4);d.setMinutes(Math.ceil(d.getMinutes()/15)*15,0,0)}
    return d;
  }
  const d=new Date(now);d.setDate(d.getDate()+1);
  const h=prof.tomorrow[d.getDay()===0||d.getDay()===6?1:0];
  d.setHours(Math.floor(h),Math.round((h%1)*60),0,0);
  return d;
}
function travel(from,p,D){
  if(p.zone==='town'){
    if(from.zone==='town')return{mins:walkMins(metres(from,p)),mode:'walk'};
    if(!D.town||!F.townMins)return null;
    return{mins:F.townMins,mode:'town'};
  }
  if(from.zone==='town')return null;
  const m=walkMins(metres(from,p));
  return m>D.walk?null:{mins:m,mode:'walk'};
}
function buildPlan(prof,start,rand,D){
  const places=F.places||[];
  const end=new Date(dayStart(start).getTime()+prof.endHour*3600e3);
  let t=start,from={lat:F.pos.lat,lon:F.pos.lon,zone:'local'};
  const steps=[],used=new Set(),specs=prof.steps(start).slice();
  const foodAfter=prof.foodAfter?new Date(dayStart(start).getTime()+prof.foodAfter*3600e3):null;
  let extra=0;
  for(let i=0;i<specs.length;i++){
    /* The mad one keeps going until late before it eats */
    if(foodAfter&&specs[i][0]==='food'&&start<foodAfter&&t<foodAfter&&extra<3){specs.splice(i,0,['club','bar','pub']);extra++}
    const roles=specs[i];let best=null;
    for(const p of places){
      if(!p.oh||used.has(p.name)||(prof.avoid&&prof.avoid(p)))continue;
      const ri=roles.indexOf(p.role);
      if(ri<0)continue;
      const tr=travel(from,p,D);
      if(!tr)continue;
      const arrive=new Date(t.getTime()+tr.mins*6e4);
      if(arrive>end||!isOpen(p,arrive))continue;
      if(p.role==='cafe'&&arrive.getHours()>=19)continue;
      const closes=nextChange(p,arrive);
      const left=closes?(closes-arrive)/6e4:1e4;
      if(left<(prof.strict?Math.max(MINSTAY[p.role],prof.stay[p.role]*.8):MINSTAY[p.role]))continue;
      let score=(roles.length-ri)*4-tr.mins*.25+rand()*6+(p.zone==='town'?prof.townBonus(i,p.role,arrive):0);
      if(prof.late)score+=Math.min(3,left/60*.6);
      if(!best||score>best.score)best={p,role:p.role,arrive,tr,closes,left:Math.round(left),score};
    }
    if(!best){if(i===0)return null;continue}
    best.rushed=best.left<prof.stay[best.role]*.6;
    steps.push(best);used.add(best.p.name);
    t=new Date(best.arrive.getTime()+Math.min(prof.stay[best.role],best.left)*6e4);
    from=best.p;
    if(t>=end)break;
  }
  return steps.length?steps:null;
}
/* Try the chosen distance first, then further. If nothing works today, tomorrow. */
function makePlan(){
  const prof=PROFILES[dial];
  const key=seed*7919+dial*101+WHENS.indexOf(when)*13+dist*7;
  const tryAt=s=>{
    for(let d=dist;d<DIST.length;d++){const st=buildPlan(prof,s,rng(key+d),DIST[d]);if(st)return{steps:st,d}}
    return null;
  };
  const start=startFor(when,prof,F.at);
  let r=tryAt(start),rolled=null,s=start;
  if(!r&&when!=='tomorrow'){
    const s2=startFor('tomorrow',prof,F.at),r2=tryAt(s2);
    if(r2){r=r2;rolled=when;s=s2}
  }
  const steps=r?r.steps:null,widened=r&&!rolled&&r.d>dist?r.d:null;
  const last=steps&&steps[steps.length-1];
  const end=last?new Date(last.arrive.getTime()+Math.min(prof.stay[last.role],last.left)*6e4):new Date(s.getTime()+2*3600e3);
  const local=(F.places||[]).filter(p=>p.zone==='local'&&p.walk<=15&&p.role!=='listing'&&p.role!=='shop');
  const known=local.filter(p=>p.oh),openAsked=known.filter(p=>isOpen(p,start)).length;
  F.plan={prof,start:s,end,steps,rolled,widened,key,
    nLocal:local.length,nKnown:known.length,allShut:known.length>=6&&openAsked/known.length<.3,
    wx:weatherFor(s,end,when==='now'&&!rolled&&F.live)};
}

const FOOD={pizza:['pizza','pizza'],indian:['Indian','a curry'],italian:['Italian','an Italian'],chinese:['Chinese','a Chinese'],
  kebab:['kebabs','a kebab'],burger:['burgers','a burger'],fish_and_chips:['fish and chips','chippy tea'],turkish:['Turkish','a Turkish'],
  thai:['Thai','a Thai'],japanese:['Japanese','Japanese'],sushi:['sushi','sushi'],mexican:['Mexican','a Mexican'],chicken:['chicken','chicken'],
  vietnamese:['Vietnamese','a Vietnamese'],korean:['Korean','a Korean'],lebanese:['Lebanese','a Lebanese'],greek:['Greek','a Greek'],
  spanish:['tapas','tapas'],french:['French','French'],british:['British','proper British'],vegan:['vegan','vegan'],coffee_shop:['coffee','a brew']};
function whatFood(p){
  const k=FOOD[p.cuisine];
  if(k)return dial===0?k[0]:k[1];
  if(p.kind==='fast_food')return 'a takeaway';
  return ['a proper sit-down','some food','scran'][dial];
}
function mealWord(d){
  const h=d.getHours();
  if(h<11)return 'breakfast';
  if(h<15)return dial===0?'lunch':'dinner';
  return dial===0?'dinner':'tea';
}
function fill(tpl,v){
  return tpl.replace(/\{(\w+)\}('s(?= \{?(\w+)))?/g,(m,k,poss,nextWord)=>{
    const lk=k[0].toLowerCase()+k.slice(1);
    let x=v[k];
    if(x===undefined&&v[lk]!==undefined)x=cap(String(v[lk]));
    x=x===undefined||x===null?'':String(x);
    if(poss)x+=/s$/i.test(x)?(nextWord==='got'?' has':' is'):"'s";
    return x;
  });
}
let R=Math.random;
const say=(set,v)=>{const opts=set[dial];return opts&&opts[0]!==null?fill(pick(opts,R),v):null};
const prec=()=>dial===0?0:1;
function baseVars(){
  const at=F.at,v={};
  v.place=F.placeName?(/^(Northern Quarter|Green Quarter|Gay Village|Village)$/.test(F.placeName)?'the ':'')+F.placeName:'your bit of the world';
  v.weekday=DAYS[at.getDay()];
  v.date=at.getDate()+' '+MONTHS[at.getMonth()];
  v.time24=t24(at);
  v.timeVague=vague(at,dial===2);
  if(F.plan){
    const s=F.plan.start;
    v.start=clockSay(s,prec(),null);
    const w=F.plan.wx;
    if(w){v.temp=Math.round(w.temp);v.minFeels=Math.round(w.minFeels);v.rainAt=clockSay(w.rainAt,prec(),s)}
    v.nLocal=F.plan.nLocal;
  }
  if(F.nearest){v.nearest=F.nearest.name;v.nearestMiles=miles(F.nearest.dist);v.nearestIn=F.nearestTown?' in '+F.nearestTown:''}
  return v;
}
function stepClause(s,i,n){
  const total=F.plan.steps.length;
  const pos=i===0?'first':i===total-1?'last':'next';
  const meal=mealWord(s.arrive);
  const v={name:s.p.name,m:s.tr.mins,left:s.left,
    closes:s.closes?clockSay(s.closes,prec(),s.arrive):(dial===0?'late':'all hours'),
    what:whatFood(s.p),meal,mealFor:meal==='breakfast'?'for breakfast':'for your '+meal,
    townWords:s.tr.mins===30?'half an hour':s.tr.mins===60?'an hour':s.tr.mins+' minutes'};
  /* Blair names the cuisine, unless the name already does ("Eden Italian Restaurant") */
  const cw=(FOOD[s.p.cuisine]||[''])[0].toLowerCase(),named=!!cw&&s.p.name.toLowerCase().includes(cw);
  v.whatParen=s.p.cuisine&&cw&&!named?' ('+v.what+')':'';
  /* "an Italian at Eden Italian Restaurant" says it twice: say the meal instead */
  if(named&&n>0&&/^an? /.test(v.what))v.what=meal==='breakfast'?'breakfast':'your '+meal;
  let tset=TRAVEL.walk;
  if(s.tr.mode==='town')tset=TRAVEL.town;
  else if(i>0&&s.tr.mins<=2)tset=TRAVEL.near;
  else if(s.tr.mins===1)tset=TRAVEL.walk1;
  v.travel=fill(tset[n][0],v);
  let set;
  if(i===0&&s.rushed&&when==='now'&&!F.plan.rolled&&s.tr.mode==='walk'&&(s.role==='pub'||s.role==='bar')){
    set=T.rushed;v.left=Math.round((s.closes-F.at)/6e4);
  }
  else if(s.tr.mode==='town'&&n===2)set=i===0?T.townHopFirst:T.townHop;
  else{const r=T[s.role]||T.bar;set=r[pos]||r.next||r.first}
  return fill(pick(set[n],R),v);
}
function stitch(steps,n){
  const parts=steps.map((s,i)=>stepClause(s,i,n)),j=JOIN[n];
  let out=parts[0];
  for(let i=1;i<parts.length;i++)out+=(i===1?j[0]:i===parts.length-1?j[2]:pick(j[1],R))+parts[i];
  return cap(out)+'.';
}
function weatherSentence(v){
  const ctx=F.plan||{start:F.at,rolled:null,wx:weatherFor(F.at,new Date(F.at.getTime()+2*3600e3),F.live)};
  const w=ctx.wx;if(!w)return null;
  if(!F.plan){v.temp=Math.round(w.temp);v.minFeels=Math.round(w.minFeels);v.rainAt=clockSay(w.rainAt,prec(),F.at)}
  const s=ctx.start,sun=sunFor(s),dark=sun?(s>=sun.set||s<sun.rise):!w.isDay;
  let k='any';
  if(w.rainNow)k='rainNow';
  else if(w.rainAt)k='rainLater';
  else if(w.minFeels<7)k='cold';
  else if(!dark&&w.code<=1&&w.temp>=17)k='sunny';
  else if(when==='now'&&!ctx.rolled&&dark&&w.sunnyHrs>=2)k='sunnyEarlier';
  else if(w.feels>=12)k='mild';
  return say(WEATHER[k],v);
}
function signLine(v){
  const p=F.plan,h=p.start.getHours();
  let k='evening';
  if(when==='tomorrow'||p.rolled)k='tomorrow';
  else if(h<6)k='small';
  else if(h<16)k='day';
  return say(SIGN[k],v);
}

/* ---------- Render ---------- */
function linesWanted(){
  const n=dial,want=[];
  if(F.mode==='start'||F.mode==='denied'||F.mode==='badPostcode'){
    const set=F.mode==='denied'?DENIED:F.mode==='badPostcode'?FAILED.badPostcode:START;
    want.push({k:'ask',text:set[n][0]});
    return want;
  }
  if(F.mode!=='run')return want;
  if(slots.when==='loading'){want.push({k:'when',text:LOADING.when[n][0],cls:'loading'});return want}
  if(slots.plan==='ready'&&!F.plan)makePlan();
  R=rng((F.plan?F.plan.key:seed)+1);
  const v=baseVars();
  const vOpen=Object.assign({},v);
  let openSet;
  if(when==='now'){
    openSet=F.tb==='small'?OPEN.now.small:F.isFri&&(F.tb==='teatime'||F.tb==='evening')?OPEN.now.friday:OPEN.now.any;
  }else{
    openSet=OPEN[when];
    const s=startFor(when,PROFILES[dial],F.at),h=s.getHours();
    vOpen.start=clockSay(s,prec(),null);vOpen.weekday=DAYS[s.getDay()];vOpen.date=s.getDate()+' '+MONTHS[s.getMonth()];
    vOpen.part=h<5?'later tonight':h<12?'this morning':h<17?'this afternoon':'this evening';
  }
  want.push({k:'when',text:fill(pick(openSet[n],R),vOpen)});
  if(F.inGM===false)want.push({k:'outside',text:say(OUTSIDE,v)});
  const wxReady=slots.weather==='ready';
  if(slots.plan==='loading'||slots.plan==='town'||slots.plan==='remote'){
    want.push({k:'plan',text:LOADING[slots.plan==='loading'?'plan':slots.plan][n][0],cls:'loading'});
  }else if(slots.plan==='failed'){
    want.push({k:'plan',text:FAILED.plan[n][0],cls:'failed'});
    if(wxReady){const w=weatherSentence(v);if(w)want.push({k:'weather',text:w})}
  }else if(slots.plan==='ready'){
    const P=F.plan;let para='';
    if(F.remote)para=say(F.nearest?NOPLAN.remote:NOPLAN.remoteNone,v);
    else if(P.steps){
      if(P.rolled)para=say(P.allShut?ROLL.allShut:ROLL.nothing,v)+' ';
      else if(P.widened)para=say(WIDER[P.widened],v)+' ';
      para+=stitch(P.steps,n);
    }else if(P.nLocal>=3&&P.nKnown<3)para=say(NOPLAN.unknown,v);
    else para=say(NOPLAN.nothing,v);
    if(wxReady){const w=weatherSentence(v);if(w)para+=' '+w}
    want.push({k:'plan',text:para});
  }
  if(slots.weather==='loading')want.push({k:'weather',text:LOADING.weather[n][0],cls:'loading'});
  else if(slots.weather==='failed')want.push({k:'weather',text:FAILED.weather[n][0],cls:'failed'});
  if(slots.plan==='ready'&&slots.weather!=='loading'){
    const P=F.plan;
    const sign=F.remote?say(NOPLAN.remoteSign,v):P.steps?signLine(v):null;
    if(sign)want.push({k:'sign',text:sign});
  }
  return want;
}
function render(){
  document.body.dataset.dial=dial;
  $('#dialName').textContent=PROFILES[dial].name;
  $('#dial').value=dial;
  $('#dial').setAttribute('aria-valuetext',PROFILES[dial].name);
  $('#distName').textContent=DIST[dist].name;
  $('#dist').value=dist;
  $('#dist').setAttribute('aria-valuetext',DIST[dist].name);
  document.querySelectorAll('[data-when]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.when===when)));
  const want=linesWanted();
  const box=$('#lines');
  const have=new Map([...box.children].map(el=>[el.dataset.k,el]));
  let prev=null;
  for(const L of want){
    let el=have.get(L.k);
    if(el)have.delete(L.k);
    else{el=document.createElement('p');el.dataset.k=L.k;el.classList.add('in')}
    const wasLoading=el.classList.contains('loading');
    if(el.textContent!==L.text)el.textContent=L.text;
    el.classList.toggle('loading',L.cls==='loading');
    el.classList.toggle('failed',L.cls==='failed');
    if(wasLoading&&L.cls!=='loading'){el.classList.remove('in');void el.offsetWidth;el.classList.add('in')}
    if(prev)prev.after(el);else box.prepend(el);
    prev=el;
  }
  for(const el of have.values())el.remove();
  $('#ask').hidden=!(F.mode==='start'||F.mode==='denied'||F.mode==='badPostcode');
  renderReceipts();renderFacts();renderTimings();renderWorkings();
}
function renderReceipts(){
  const el=$('#receipts');
  const P=F.mode==='run'&&slots.plan==='ready'?F.plan:null;
  if(!P||!P.steps||F.remote){el.textContent='';return}
  el.textContent='Plan: '+P.steps.map(s=>{
    const how=s.tr.mode==='town'?`about ${s.tr.mins} min into town`:`${s.tr.mins} min walk`;
    return `${t24(s.arrive)} ${s.p.name}, ${s.p.kind.replace('_',' ')}, ${how}, ${s.closes?'till '+t24(s.closes):'open all hours'}`;
  }).join(' → ');
}
function renderFacts(){
  const parts=[];
  if(F.mode==='run'){
    const at=F.at;
    parts.push(`${t24(at)} ${DAYS[at.getDay()].slice(0,3)} ${at.getDate()} ${MONTHS[at.getMonth()].slice(0,3)}`);
    if(F.placeName||F.postcode)parts.push([F.placeName,F.postcode].filter(Boolean).join(', '));
    const w=F.wxRaw?weatherFor(at,at,F.live):null;
    if(w){
      parts.push(`Now ${Math.round(w.temp)}°C, feels ${Math.round(w.feels)}°C, ${condWord(w.code,w.isDay)}`);
      if(w.tomMax!=null)parts.push(`Tomorrow ${Math.round(w.tomMax)}° / ${Math.round(w.tomMin)}°`);
    }
    const sun=F.pos?sunFor(at):null;
    if(sun)parts.push((at>sun.set?'Sunset was ':'Sunset ')+t24(sun.set));
    if(F.townMins)parts.push(`Town about ${F.townMins} min`);
    if(test.at||test.postcode)parts.push('Test run');
  }
  parts.push('Decentish '+VERSION);
  $('#facts').textContent=parts.join(' · ');
}
function renderTimings(){
  const el=$('#timings');
  if(!timings.length){el.textContent='';return}
  const bits=timings.map(t=>{
    const r=t.status==='pending'?'…':t.status==='ok'?(t.ms/1000).toFixed(2)+'s':t.status==='timeout'?'timed out':'failed';
    return `${t.name} ${r}${t.note?' ('+t.note+')':''}`;
  });
  if(runTotal!=null)bits.push(`Total ${(runTotal/1000).toFixed(2)}s`);
  if(F.updated)bits.push('Updated '+t24(F.updated));
  el.textContent=bits.join(' · ');
}
function renderWorkings(){
  const box=$('#workings');
  if(box.hidden)return;
  box.textContent='';
  if(!F.places){box.textContent='Nothing loaded yet.';return}
  const P=F.plan;
  const head=document.createElement('p');
  head.textContent=`Profile: ${PROFILES[dial].name} · Distance: ${DIST[dist].name}${P&&P.widened?' (widened to '+DIST[P.widened].name+')':''} · When: ${when}${P&&P.rolled?' (rolled to tomorrow)':''} · Plan starts ${P?t24(P.start)+' '+DAYS[P.start.getDay()]:'–'} · In Greater Manchester: ${F.inGM===null?'unknown':F.inGM?'yes':'no'} · Places: ${F.places.filter(p=>p.zone==='local').length} local, ${F.places.filter(p=>p.zone==='town').length} in town`;
  const ol=document.createElement('ol');
  const at=P?P.start:F.at;
  for(const p of F.places.slice(0,150)){
    const li=document.createElement('li');
    let st;
    if(p.role==='listing')st='needs listings, left out';
    else if(!p.oh)st=p.raw?'hours unclear: '+p.raw:'no hours on the map';
    else{const o=isOpen(p,at),nx=nextChange(p,at);st=o?'open'+(nx?' till '+clockSay(nx,0,at):', all hours'):'shut'+(nx?', opens '+clockSay(nx,0,at):'')}
    li.textContent=`${p.zone==='town'?'town':p.walk+' min'} · ${p.name} · ${p.role}${p.cuisine?' ('+p.cuisine+')':''} · ${st}`;
    ol.append(li);
  }
  box.append(head,ol);
}

/* ---------- Run ---------- */
function bucket(d){
  const m=d.getHours()*60+d.getMinutes();
  if(m<60)return 'late';if(m<300)return 'small';if(m<540)return 'early';if(m<720)return 'morning';
  if(m<990)return 'afternoon';if(m<1170)return 'teatime';if(m<1350)return 'evening';return 'late';
}
async function run(opts={}){
  const id=++runId;
  runStart=performance.now();runTotal=null;timings=[];seed=Math.floor(Math.random()*1e9);
  const live=!test.at;
  const at=test.at?new Date(test.at):new Date();
  F={mode:'run',at,live,tb:bucket(at),isFri:at.getDay()===5,inGM:null};
  slots={when:'loading'};
  render();
  if(!libsPromise)libsPromise=timed('Hours engine',loadLibs,20000).catch(()=>null);
  else timings.push({name:'Hours engine',status:'ok',ms:0,note:'already loaded'});
  const pc=test.postcode||opts.postcode||'';
  let pos,pcInfo=null;
  try{
    if(pc){pcInfo=await timed('Postcode',()=>lookupPostcode(pc),8000);pos={lat:pcInfo.lat,lon:pcInfo.lon}}
    else pos=await timed(permState==='granted'?'Location':'Location (incl. your tap)',getPosition,25000);
  }catch(e){
    if(id!==runId)return;
    F.mode=pc?'badPostcode':'denied';
    runTotal=performance.now()-runStart;render();return;
  }
  if(id!==runId)return;
  F.pos=pos;
  const q={lat:+pos.lat.toFixed(3),lon:+pos.lon.toFixed(3)};
  const pPost=pcInfo?Promise.resolve(pcInfo):timed('Postcode',()=>reversePostcode(q),8000).catch(()=>null);
  const pName=timed('Place name',()=>placeName(q),8000).catch(()=>null);
  const pWx=timed('Weather',()=>getJSON(weatherUrl(q),9000),10000).catch(()=>null);
  const pLocal=timed('Places',()=>overpass(venueQuery(q.lat,q.lon,SEARCH_M)),30000).catch(()=>null);
  const pi=await pPost;
  if(id!==runId)return;
  F.postcode=pi&&pi.postcode;F.country=pi&&pi.country;
  F.inGM=pi?GM.includes(pi.district):null;
  const kmToTown=metres(pos,TOWN)/1000;
  let pTown=Promise.resolve(null);
  if(F.inGM&&kmToTown>2.5){
    F.townMins=Math.round((8+kmToTown*2.6)/5)*5;
    pTown=timed('Town places',()=>overpass(venueQuery(TOWN.lat,TOWN.lon,TOWN.r)),30000).catch(()=>null);
  }
  const nm=await pName;
  if(id!==runId)return;
  F.placeName=nm||(pi&&(pi.ward||pi.district))||null;
  slots.when='ready';slots.plan='loading';slots.weather='loading';
  render();
  const wxDone=pWx.then(w=>{
    if(id!==runId)return;
    F.wxRaw=w&&w.hourly?w:null;
    slots.weather=F.wxRaw?'ready':'failed';
    F.plan=null;render();
  });
  const planDone=(async()=>{
    const[local,OH]=await Promise.all([pLocal,libsPromise]);
    if(id!==runId)return;
    if(!local){slots.plan='failed';render();return}
    if(F.townMins){slots.plan='town';render()}
    const town=await pTown;
    if(id!==runId)return;
    F.places=mergePlaces(makePlaces(local.els,'local',OH,F.country),town?makePlaces(town.els,'town',OH,F.country):[]);
    const near=F.places.filter(p=>p.zone==='local'&&p.walk<=20&&p.role!=='listing'&&p.role!=='shop');
    F.remote=!near.length&&!F.places.some(p=>p.zone==='town');
    if(F.remote){
      slots.plan='remote';render();
      const wide=await timed('Wider search',()=>overpass(wideQuery(q)),30000).catch(()=>null);
      if(id!==runId)return;
      if(wide){
        const nn=makePlaces(wide.els,'far',OH,F.country).sort((a,b)=>a.dist-b.dist)[0];
        if(nn){
          F.nearest=nn;
          let town=nn.town;
          if(!town)town=await timed('Nearest town',()=>placeName({lat:+nn.lat.toFixed(3),lon:+nn.lon.toFixed(3)},14),8000).catch(()=>null);
          F.nearestTown=town&&town!==F.placeName?town:null;
        }
      }
    }
    slots.plan='ready';F.plan=null;render();
  })();
  await Promise.all([wxDone,planDone]);
  if(id!==runId)return;
  runTotal=performance.now()-runStart;F.updated=new Date();
  render();
}
function replan(){if(F.mode==='run'){F.plan=null;render()}}

/* ---------- Controls ---------- */
$('#dial').addEventListener('input',e=>{dial=+e.target.value;store.set('dial3',dial);replan()});
$('#dist').addEventListener('input',e=>{dist=+e.target.value;store.set('dist',dist);replan()});
document.querySelectorAll('[data-when]').forEach(b=>b.addEventListener('click',()=>{when=b.dataset.when;replan()}));
/* Another plan: a fresh pick from the same data. After five minutes it fetches everything again. */
$('#refresh').addEventListener('click',()=>{
  if(F.mode==='start'||F.mode==='denied')return askLocation();
  if(F.mode==='run'&&runTotal!=null&&F.updated&&Date.now()-F.updated<5*60e3&&slots.plan==='ready'){seed=Math.floor(Math.random()*1e9);replan();return}
  run(lastOpts);
});
function askLocation(){lastOpts={};run(lastOpts)}
$('#useLocation').addEventListener('click',askLocation);
$('#askForm').addEventListener('submit',e=>{
  e.preventDefault();
  const pc=$('#askPostcode').value.trim();
  if(!pc){$('#askPostcode').focus();return}
  lastOpts={postcode:pc};run(lastOpts);
});
function toggle(btn,box){
  const open=box.hidden;box.hidden=!open;btn.setAttribute('aria-expanded',String(open));
  if(open&&box.id==='workings')renderWorkings();
}
$('#workingsToggle').addEventListener('click',e=>toggle(e.currentTarget,$('#workings')));
$('#labToggle').addEventListener('click',e=>toggle(e.currentTarget,$('#lab')));
const toLocalInput=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
function nextDay(dow,h,m){
  const now=new Date(),d=new Date(now);
  d.setDate(now.getDate()+((dow-now.getDay()+7)%7));d.setHours(h,m,0,0);
  if(d<now)d.setDate(d.getDate()+7);
  return d;
}
$('#labForm').addEventListener('submit',e=>{
  e.preventDefault();
  test.postcode=$('#tPostcode').value.trim();
  test.at=$('#tAt').value;
  run({});
});
$('#tClear').addEventListener('click',()=>{
  test.postcode='';test.at='';$('#tPostcode').value='';$('#tAt').value='';
  run(lastOpts);
});
document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{
  const p=b.dataset.preset;
  if(p==='fri')$('#tAt').value=toLocalInput(nextDay(5,17,30));
  if(p==='sat')$('#tAt').value=toLocalInput(nextDay(6,23,0));
  if(p==='sun')$('#tAt').value=toLocalInput(nextDay(0,10,0));
  if(p==='small'){const d=new Date();if(d.getHours()>=3)d.setDate(d.getDate()+1);d.setHours(3,0,0,0);$('#tAt').value=toLocalInput(d)}
  if(p==='nq')$('#tPostcode').value='M4 1HN';
  if(p==='remote')$('#tPostcode').value='HS9';
  $('#labForm').requestSubmit();
}));

/* ---------- Start ---------- */
async function boot(){
  render();
  try{
    const p=await navigator.permissions.query({name:'geolocation'});
    permState=p.state;
  }catch(e){}
  if(permState==='granted')run({});
  else{F={mode:'start'};render()}
}
boot();
})();
</script>
